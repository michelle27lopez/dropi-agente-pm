<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dropi — Ruta inteligente de ventas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --dropi: #F77F00;
  --dropi-light: #FFF3E0;
  --bg: #f0ede8;
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #111;
  --text-secondary: #666;
  --text-muted: #aaa;
  --border: rgba(0,0,0,0.1);
  --border-mid: rgba(0,0,0,0.18);
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  font-size: 14px;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
}
.shell {
  display: flex;
  width: 1100px;
  min-height: 720px;
  background: var(--bg-primary);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.14);
  border: 0.5px solid var(--border);
}

/* ── Sidebar ── */
.sidebar {
  width: 200px;
  flex-shrink: 0;
  background: #fff;
  border-right: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
}
.logo-area {
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 0.5px solid var(--border);
}
.logo-area img { height: 24px; object-fit: contain; }
.nav { flex: 1; padding: 8px 6px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 7px;
  font-size: 12.5px; color: var(--text-secondary);
  cursor: pointer; transition: background 0.15s;
}
.nav-item:hover { background: #f5f5f5; }
.nav-item.active { background: var(--dropi-light); color: var(--dropi); font-weight: 600; }
.nav-item i { font-size: 17px; flex-shrink: 0; }
.badge {
  font-size: 9px; font-weight: 700; padding: 2px 6px;
  border-radius: 10px; margin-left: auto;
}
.badge.green { background: #e8f5e9; color: #2e7d32; }
.badge.orange { background: var(--dropi-light); color: var(--dropi); }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f8f6f2; }
.topbar {
  height: 56px; flex-shrink: 0;
  display: flex; align-items: center;
  padding: 0 24px; background: #fff;
  border-bottom: 0.5px solid var(--border);
  gap: 12px;
}
.topbar-info { flex: 1; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.topbar-sub { font-size: 11.5px; color: var(--text-secondary); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.membership { font-size: 11px; padding: 4px 12px; border-radius: 14px; background: var(--dropi); color: #fff; font-weight: 700; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--dropi-light); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--dropi); }

/* ── Chat ── */
.chat-area {
  flex: 1; overflow-y: auto; padding: 24px 28px;
  display: flex; flex-direction: column; gap: 20px;
}
.msg-row { display: flex; gap: 10px; align-items: flex-end; }
.msg-row.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
}
.msg-avatar.bot { background: var(--dropi); color: #fff; font-size: 17px; }
.msg-avatar.user-av { background: var(--dropi-light); color: var(--dropi); font-size: 11px; font-weight: 700; }
.msg-bubble {
  max-width: 72%; padding: 12px 16px;
  border-radius: 14px; font-size: 13.5px; line-height: 1.65;
  color: var(--text-primary);
}
.msg-bubble.bot { background: #fff; border: 0.5px solid var(--border); border-bottom-left-radius: 4px; }
.msg-bubble.user { background: var(--dropi); color: #fff; border-bottom-right-radius: 4px; }
.msg-time { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; text-align: right; }
.msg-time.bot-time { text-align: left; }

/* Typing indicator */
.typing-bubble {
  background: #fff; border: 0.5px solid var(--border);
  border-radius: 14px; border-bottom-left-radius: 4px;
  padding: 14px 18px; display: flex; gap: 5px; align-items: center;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

/* ── Route card ── */
.route-card {
  background: #fff; border: 0.5px solid var(--border);
  border-radius: 14px; overflow: hidden;
  max-width: 540px; margin-top: 4px;
}
.route-header {
  padding: 14px 18px 12px; background: var(--dropi);
  display: flex; align-items: center; gap: 10px;
}
.route-header-text { flex: 1; }
.route-header-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 2px; }
.route-header-sub { font-size: 11.5px; color: rgba(255,255,255,0.8); }
.route-steps { padding: 4px 0; }
.route-step {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 18px; border-bottom: 0.5px solid #f0f0f0;
  cursor: pointer; transition: background 0.15s; position: relative;
}
.route-step:last-child { border-bottom: none; }
.route-step:hover { background: #fafafa; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--dropi-light); color: var(--dropi);
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.step-body { flex: 1; min-width: 0; }
.step-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
.step-desc { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; }
.step-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; color: var(--dropi);
  background: var(--dropi-light); padding: 4px 10px;
  border-radius: 20px; text-decoration: none;
  transition: opacity 0.15s;
}
.step-link:hover { opacity: 0.8; }
.step-week {
  font-size: 10px; font-weight: 700; color: #888;
  background: #f0f0f0; padding: 3px 8px; border-radius: 10px;
  white-space: nowrap; align-self: flex-start; margin-top: 3px;
}

/* ── Social proof card ── */
.proof-card {
  background: #fff; border: 0.5px solid var(--border);
  border-radius: 14px; overflow: hidden;
  max-width: 540px; margin-top: 4px;
}
.proof-header {
  padding: 12px 16px;
  background: linear-gradient(90deg, #111 0%, #333 100%);
  display: flex; align-items: center; gap: 10px;
}
.proof-header i { color: #F77F00; font-size: 20px; }
.proof-header-text { color: #fff; font-size: 13px; font-weight: 600; }
.proof-header-sub { color: rgba(255,255,255,0.65); font-size: 11px; }
.proof-body { padding: 16px 18px; }
.proof-stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.proof-stat { text-align: center; padding: 10px; background: #f8f8f8; border-radius: 8px; }
.proof-stat-num { font-size: 22px; font-weight: 700; color: var(--text-primary); line-height: 1; margin-bottom: 3px; }
.proof-stat-num span { font-size: 13px; color: var(--dropi); }
.proof-stat-label { font-size: 10.5px; color: var(--text-secondary); }
.proof-brands { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.proof-avatars { display: flex; }
.proof-av {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid #fff; margin-left: -7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
}
.proof-av:first-child { margin-left: 0; }
.proof-brands-text { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
.proof-brands-text strong { color: var(--text-primary); font-weight: 700; }
.proof-bar-wrap { margin-bottom: 6px; }
.proof-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
.proof-bar-bg { background: #eee; border-radius: 4px; height: 7px; overflow: hidden; }
.proof-bar-fill { height: 100%; border-radius: 4px; background: var(--dropi); transition: width 1.5s ease; }
.proof-quote {
  background: var(--dropi-light); border-radius: 8px; padding: 10px 14px;
  font-size: 12px; color: #555; line-height: 1.6; margin-top: 10px;
  border-left: 3px solid var(--dropi);
}
.proof-quote strong { color: #111; font-weight: 600; }

/* ── Input area ── */
.chat-input-area {
  flex-shrink: 0; padding: 14px 24px; background: #fff;
  border-top: 0.5px solid var(--border);
  display: flex; gap: 10px; align-items: flex-end;
}
.chat-input {
  flex: 1; padding: 11px 16px; border-radius: 24px;
  border: 0.5px solid var(--border-mid);
  background: #f8f8f8; font-size: 13.5px;
  color: var(--text-primary); outline: none;
  font-family: inherit; resize: none; line-height: 1.5;
  max-height: 80px; transition: border-color 0.15s;
}
.chat-input:focus { border-color: var(--dropi); background: #fff; }
.send-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--dropi); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.15s;
}
.send-btn:hover { opacity: 0.85; }
.send-btn i { color: #fff; font-size: 18px; }

/* Quick replies */
.quick-replies { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 6px; }
.qr {
  padding: 7px 14px; border-radius: 20px;
  border: 0.5px solid var(--dropi); color: var(--dropi);
  background: var(--dropi-light); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.qr:hover { background: var(--dropi); color: #fff; }

.fade-in { animation: fadeUp 0.35s ease forwards; }
@keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-area">
      <img src="https://d1l4mzebo786pw.cloudfront.net/image/input/white-labels/1/logos/secondary_logo/logo-naranja.png" alt="Dropi"
        onerror="this.outerHTML='<span style=font-size:17px;font-weight:700;color:#F77F00>dropi</span>'" />
    </div>
    <nav class="nav">
      <div class="nav-item active"><i class="ti ti-message-chatbot"></i><span>Asistente</span></div>
      <div class="nav-item"><i class="ti ti-home"></i><span>Inicio</span></div>
      <div class="nav-item"><i class="ti ti-package"></i><span>Productos</span></div>
      <div class="nav-item"><i class="ti ti-layout-grid"></i><span>Plantillas</span><span class="badge orange">Nuevo</span></div>
      <div class="nav-item"><i class="ti ti-shopping-cart"></i><span>Mis Pedidos</span></div>
      <div class="nav-item"><i class="ti ti-shield-check"></i><span>Mis Garantías</span></div>
      <div class="nav-item"><i class="ti ti-chart-bar"></i><span>ROAX</span><span class="badge green">Beta</span></div>
      <div class="nav-item"><i class="ti ti-school"></i><span>Academy</span></div>
      <div class="nav-item"><i class="ti ti-settings"></i><span>Configuración</span></div>
    </nav>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div style="width:36px;height:36px;border-radius:50%;background:var(--dropi);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ti-sparkles" style="color:#fff;font-size:18px"></i>
      </div>
      <div class="topbar-info">
        <div class="topbar-title">Dropi IA · Tu asistente de ventas</div>
        <div class="topbar-sub" style="display:flex;align-items:center;gap:5px">
          <span style="width:7px;height:7px;border-radius:50%;background:#4CAF50;display:inline-block"></span>
          En línea · responde en segundos
        </div>
      </div>
      <div class="topbar-right">
        <span class="membership">Membership Pro</span>
        <i class="ti ti-bell" style="font-size:20px;color:#aaa;cursor:pointer"></i>
        <div class="avatar">LC</div>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <!-- Messages injected by JS -->
    </div>

    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="Escribe tu meta o pregunta..." onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" onclick="sendUserMsg()"><i class="ti ti-send"></i></button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chatArea');
const input = document.getElementById('chatInput');
let seqDone = false;

function now() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function appendMsg(html, animate = true) {
  const div = document.createElement('div');
  div.innerHTML = html;
  if (animate) div.firstElementChild && div.firstElementChild.classList.add('fade-in');
  chat.appendChild(div.firstElementChild || div);
  chat.scrollTop = chat.scrollHeight;
}

function botMsg(content, time) {
  return `
    <div class="msg-row">
      <div class="msg-avatar bot"><i class="ti ti-sparkles" style="font-size:16px"></i></div>
      <div>
        <div class="msg-bubble bot">${content}</div>
        <div class="msg-time bot-time">${time || now()}</div>
      </div>
    </div>`;
}

function userMsg(content, time) {
  return `
    <div class="msg-row user">
      <div class="msg-avatar user-av">LC</div>
      <div>
        <div class="msg-bubble user">${content}</div>
        <div class="msg-time">${time || now()}</div>
      </div>
    </div>`;
}

function typingRow() {
  const d = document.createElement('div');
  d.className = 'msg-row fade-in';
  d.id = 'typingRow';
  d.innerHTML = `
    <div class="msg-avatar bot"><i class="ti ti-sparkles" style="font-size:16px"></i></div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runSequence() {
  seqDone = false;

  /* 1. Bot saluda */
  await delay(400);
  appendMsg(botMsg(`¡Hola, Laura! 👋 Soy tu asistente de ventas en Dropi.<br/><br/>
    Estoy aquí para ayudarte a definir tu ruta hacia tu primera meta.
    <strong>¿Cuánto quieres vender en tu primer mes?</strong>`));

  await delay(800);
  appendMsg(`<div class="quick-replies fade-in">
    <div class="qr" onclick="selectGoal(this,'$500.000')">$500.000</div>
    <div class="qr" onclick="selectGoal(this,'$1.000.000')">$1.000.000</div>
    <div class="qr" onclick="selectGoal(this,'$2.000.000')">$2.000.000</div>
    <div class="qr" onclick="selectGoal(this,'$5.000.000+')">$5.000.000+</div>
  </div>`);

  await delay(2200);
  /* 2. Usuario responde */
  appendMsg(userMsg('Quiero llegar a <strong>$1.000.000 COP</strong> en mi primer mes 🎯'));
  document.querySelector('.quick-replies') && (document.querySelector('.quick-replies').style.display = 'none');

  await delay(500);
  typingRow();
  await delay(1800);
  removeTyping();

  /* 3. Bot confirma */
  appendMsg(botMsg(`Perfecto, Laura. Meta registrada: <strong style="color:#F77F00">$1.000.000 en el mes 1.</strong><br/><br/>
    Analicé tu perfil y encontré que <strong>1.247 dropshippers con tu mismo punto de partida</strong> lograron esa meta
    — o la superaron — siguiendo una ruta específica. Te la comparto ahora. 🚀`));

  await delay(600);
  typingRow();
  await delay(2200);
  removeTyping();

  /* 4. Ruta de pasos */
  appendMsg(botMsg(`Aquí está tu <strong>Ruta Dropi hacia $1.000.000</strong> — 4 semanas, 5 acciones:`));
  await delay(300);
  appendMsg(`<div class="msg-row fade-in">
    <div class="msg-avatar bot" style="visibility:hidden"></div>
    <div class="route-card">
      <div class="route-header">
        <div style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px">🗺️</div>
        <div class="route-header-text">
          <div class="route-header-title">Tu ruta personalizada · Meta $1.000.000</div>
          <div class="route-header-sub">Mes 1 · Basado en 1.247 casos exitosos como el tuyo</div>
        </div>
      </div>
      <div class="route-steps">

        <div class="route-step">
          <div class="step-num">1</div>
          <div class="step-body">
            <div class="step-title">🏪 Activa tu tienda en Dropi</div>
            <div class="step-desc">Completa tu perfil, logo y datos de pago. Las tiendas completas convierten <strong>3.2× más</strong>.</div>
            <a class="step-link" href="#">
              <i class="ti ti-external-link" style="font-size:12px"></i> Ir a Configuración
            </a>
          </div>
          <span class="step-week">Semana 1</span>
        </div>

        <div class="route-step">
          <div class="step-num">2</div>
          <div class="step-body">
            <div class="step-title">📦 Elige 3 productos ganadores</div>
            <div class="step-desc">Selecciona productos con >$40k margen y <7 días de envío. El 78% de los dropshippers exitosos empieza con máx. 3 referencias.</div>
            <a class="step-link" href="#">
              <i class="ti ti-external-link" style="font-size:12px"></i> Ir a Productos
            </a>
          </div>
          <span class="step-week">Semana 1</span>
        </div>

        <div class="route-step">
          <div class="step-num">3</div>
          <div class="step-body">
            <div class="step-title">📣 Lanza tu kit de comunicación</div>
            <div class="step-desc">Activa la Story, el script de WhatsApp y el copy de Facebook que ya están listos para tus productos.</div>
            <a class="step-link" href="#">
              <i class="ti ti-external-link" style="font-size:12px"></i> Ir a Plantillas
            </a>
          </div>
          <span class="step-week">Semana 2</span>
        </div>

        <div class="route-step">
          <div class="step-num">4</div>
          <div class="step-body">
            <div class="step-title">📊 Monitorea con ROAX cada 3 días</div>
            <div class="step-desc">Revisa tus métricas de conversión y ajusta el canal que mejor está funcionando. Los que monitorean activamente logran la meta <strong>2.1× más rápido</strong>.</div>
            <a class="step-link" href="#">
              <i class="ti ti-external-link" style="font-size:12px"></i> Ir a ROAX
            </a>
          </div>
          <span class="step-week">Semana 2–3</span>
        </div>

        <div class="route-step">
          <div class="step-num">5</div>
          <div class="step-body">
            <div class="step-title">🎓 Academy: módulo "Primeras 10 ventas"</div>
            <div class="step-desc">45 minutos que marcan la diferencia. El 91% de quienes completan este módulo consigue su primera venta en <7 días.</div>
            <a class="step-link" href="#">
              <i class="ti ti-external-link" style="font-size:12px"></i> Ir a Academy
            </a>
          </div>
          <span class="step-week">Semana 1</span>
        </div>

      </div>
    </div>
  </div>`);

  await delay(800);
  typingRow();
  await delay(2000);
  removeTyping();

  /* 5. Social proof */
  appendMsg(botMsg(`Y esto no es solo una teoría — acá están los datos de dropshippers que empezaron igual que tú 👇`));
  await delay(300);
  appendMsg(`<div class="msg-row fade-in">
    <div class="msg-avatar bot" style="visibility:hidden"></div>
    <div class="proof-card">
      <div class="proof-header">
        <i class="ti ti-chart-dots-3"></i>
        <div>
          <div class="proof-header-text">Resultados reales · Mes 1</div>
          <div class="proof-header-sub">Dropshippers con meta $1.000.000 · misma categoría</div>
        </div>
      </div>
      <div class="proof-body">

        <div class="proof-stat-row">
          <div class="proof-stat">
            <div class="proof-stat-num">1.247</div>
            <div class="proof-stat-label">siguieron esta ruta</div>
          </div>
          <div class="proof-stat">
            <div class="proof-stat-num">89<span>%</span></div>
            <div class="proof-stat-label">alcanzaron su meta</div>
          </div>
          <div class="proof-stat">
            <div class="proof-stat-num">$1.3<span>M</span></div>
            <div class="proof-stat-label">promedio mes 1</div>
          </div>
        </div>

        <div class="proof-brands">
          <div class="proof-avatars">
            ${[
              ['MR','#FF7043'],['SK','#42A5F5'],['JP','#66BB6A'],
              ['AT','#AB47BC'],['LG','#26C6DA'],['+1k','#F77F00']
            ].map(([l,c]) => `<div class="proof-av" style="background:${c};color:#fff">${l}</div>`).join('')}
          </div>
          <div class="proof-brands-text">
            <strong>1.247 dropshippers</strong> con tu mismo punto de partida
            siguieron esta ruta en su primer mes.
          </div>
        </div>

        <div class="proof-bar-wrap">
          <div class="proof-bar-label">
            <span>Completaron la ruta y alcanzaron la meta</span>
            <span style="font-weight:700;color:#111">89%</span>
          </div>
          <div class="proof-bar-bg"><div class="proof-bar-fill" id="bar1" style="width:0%"></div></div>
        </div>
        <div class="proof-bar-wrap" style="margin-top:8px">
          <div class="proof-bar-label">
            <span>Primera venta en menos de 7 días</span>
            <span style="font-weight:700;color:#111">74%</span>
          </div>
          <div class="proof-bar-bg"><div class="proof-bar-fill" id="bar2" style="width:0%;background:#4CAF50"></div></div>
        </div>
        <div class="proof-bar-wrap" style="margin-top:8px">
          <div class="proof-bar-label">
            <span>Superaron la meta del mes 1</span>
            <span style="font-weight:700;color:#111">61%</span>
          </div>
          <div class="proof-bar-bg"><div class="proof-bar-fill" id="bar3" style="width:0%;background:#9C27B0"></div></div>
        </div>

        <div class="proof-quote">
          <i class="ti ti-quote" style="color:#F77F00;font-size:15px;margin-right:4px"></i>
          <strong>"Seguí la ruta paso a paso y en la semana 3 ya había superado el millón. La clave fue el módulo de Academy y los scripts de WhatsApp."</strong>
          <div style="margin-top:5px;font-size:11px;color:#888">— Santiago K. · Medellín · Electrónica · Mes 1: $1.38M</div>
        </div>
      </div>
    </div>
  </div>`);

  /* animar barras */
  await delay(400);
  document.getElementById('bar1') && (document.getElementById('bar1').style.width = '89%');
  document.getElementById('bar2') && (document.getElementById('bar2').style.width = '74%');
  document.getElementById('bar3') && (document.getElementById('bar3').style.width = '61%');

  await delay(800);
  typingRow();
  await delay(1500);
  removeTyping();

  /* 6. Cierre */
  appendMsg(botMsg(`Todo está listo, Laura. Tu ruta queda guardada en tu perfil y puedes consultarla cuando quieras.<br/><br/>
    ¿Por dónde quieres empezar? 👇`));

  await delay(400);
  appendMsg(`<div class="quick-replies fade-in" id="finalQR">
    <div class="qr" onclick="qrClick(this,'Quiero activar mi tienda ahora')">🏪 Activar tienda</div>
    <div class="qr" onclick="qrClick(this,'Muéstrame los mejores productos para mi meta')">📦 Ver productos</div>
    <div class="qr" onclick="qrClick(this,'Quiero ver mi kit de comunicación listo')">📣 Kit de comunicación</div>
  </div>`);

  seqDone = true;
}

function selectGoal(el, val) {
  document.querySelector('.quick-replies').style.display = 'none';
  appendMsg(userMsg(`Quiero llegar a <strong>${val} COP</strong> en mi primer mes 🎯`));
}

function qrClick(el, text) {
  document.getElementById('finalQR').style.display = 'none';
  appendMsg(userMsg(text));
  setTimeout(() => {
    typingRow();
    setTimeout(() => {
      removeTyping();
      appendMsg(botMsg(`¡Perfecto! Voy a llevarte directo a esa sección con todo configurado para tu meta. <strong>Un momento...</strong> 🚀`));
    }, 1500);
  }, 400);
}

async function sendUserMsg() {
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  appendMsg(userMsg(val));
  await delay(500);
  typingRow();
  await delay(1600);
  removeTyping();
  appendMsg(botMsg(`Entendido. Estoy procesando tu consulta sobre <em>"${val}"</em> y generando la mejor ruta para tu meta. ¿Quieres que ajuste el plan según este contexto?`));
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendUserMsg();
  }
}

/* autosize textarea */
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 80) + 'px';
});

runSequence();
</script>
</body>
</html>
