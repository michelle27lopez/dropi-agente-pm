<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Pilot — Documento de Lanzamiento</title>
<style>
  :root{
    --page-bg:#f7f7f5;
    --surface:#ffffff;
    --surface-sunken:#fbfbfa;
    --ink:#0b0b0b;
    --ink-secondary:#52514e;
    --ink-muted:#898781;
    --border:rgba(11,11,11,0.09);
    --border-strong:rgba(11,11,11,0.14);
    --accent:#2a78d6;
    --accent-soft:#eaf2fc;
    --violet:#4a3aa7;
    --violet-soft:#eeecf9;
    --aqua:#1baf7a;
    --aqua-soft:#e6f7f0;
    --orange:#eb6834;
    --orange-soft:#fdece4;
    --good:#0ca30c;
    --good-soft:#e7f6e3;
    --warning:#b9790a;
    --warning-soft:#fdf1da;
    --serious:#c85a34;
    --serious-soft:#fbe9e1;
    --critical:#d03b3b;
    --critical-soft:#fbe6e6;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(11,11,11,0.04), 0 1px 1px rgba(11,11,11,0.03);
    --shadow-md:0 4px 16px rgba(11,11,11,0.06), 0 1px 3px rgba(11,11,11,0.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--page-bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  img,svg{display:block;}
  a{color:inherit;text-decoration:none;}

  .icon{width:18px;height:18px;flex-shrink:0;}
  .icon-sm{width:14px;height:14px;}
  .icon-lg{width:22px;height:22px;}

  /* ============ LAYOUT ============ */
  .shell{max-width:1180px;margin:0 auto;padding:0 24px 96px;}
  section{scroll-margin-top:84px;}

  /* ============ TOPBAR ============ */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,0.86);
    backdrop-filter:blur(10px) saturate(160%);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;padding:12px 24px;
    display:flex;align-items:center;gap:20px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;white-space:nowrap;}
  .brand-mark{
    width:26px;height:26px;border-radius:7px;
    background:linear-gradient(135deg,var(--accent),var(--violet));
    display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  }
  .brand-mark svg{width:15px;height:15px;}
  .navpills{
    display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;
  }
  .navpills::-webkit-scrollbar{display:none;}
  .navpill{
    padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:560;
    color:var(--ink-secondary);white-space:nowrap;transition:background .15s,color .15s;
    border:1px solid transparent;
  }
  .navpill:hover{background:var(--surface-sunken);color:var(--ink);}
  .navpill.active{background:var(--ink);color:#fff;}

  /* ============ HERO / HEADER ============ */
  .hero{
    margin-top:24px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
    padding:32px 34px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, var(--accent-soft) 0%, transparent 72%);
    pointer-events:none;
  }
  .hero-kicker{
    display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;
    color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;
  }
  .hero-title{font-size:clamp(24px,3.4vw,34px);font-weight:700;letter-spacing:-0.015em;margin:0 0 16px;max-width:760px;}
  .hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .hero-foot{display:flex;flex-wrap:wrap;gap:28px;align-items:center;padding-top:20px;border-top:1px solid var(--border);}
  .hero-foot-item{display:flex;align-items:center;gap:9px;}
  .hero-foot-label{font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:650;margin-bottom:2px;}
  .hero-foot-value{font-size:13.5px;font-weight:600;color:var(--ink);}
  .team-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .team-chip{
    font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;
    background:var(--surface-sunken);border:1px solid var(--border);color:var(--ink-secondary);
  }

  /* ============ BADGES ============ */
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:650;
    border:1px solid transparent;
  }
  .badge svg{width:13px;height:13px;}
  .badge-neutral{background:var(--surface-sunken);color:var(--ink-secondary);border-color:var(--border);}
  .badge-accent{background:var(--accent-soft);color:var(--accent);}
  .badge-violet{background:var(--violet-soft);color:var(--violet);}
  .badge-aqua{background:var(--aqua-soft);color:#0f8a5f;}
  .badge-good{background:var(--good-soft);color:#1f7a10;}
  .badge-warning{background:var(--warning-soft);color:var(--warning);}
  .badge-serious{background:var(--serious-soft);color:var(--serious);}
  .badge-critical{background:var(--critical-soft);color:var(--critical);}
  .badge-orange{background:var(--orange-soft);color:#b4501f;}

  /* ============ SECTION HEADINGS ============ */
  .section-head{margin:64px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .section-eyebrow{display:flex;align-items:center;gap:9px;color:var(--ink-muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
  .section-eyebrow .num{
    width:20px;height:20px;border-radius:6px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
  }
  .section-title{font-size:22px;font-weight:700;letter-spacing:-0.01em;margin:0;}
  .section-sub{font-size:13.5px;color:var(--ink-secondary);margin-top:6px;max-width:640px;}

  /* ============ CARDS / GRIDS ============ */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);padding:22px;
  }
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:620px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  /* Executive summary */
  .summary-card{padding:26px 28px;}
  .summary-text{font-size:15px;color:var(--ink-secondary);max-width:820px;line-height:1.68;}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;}
  @media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.kpi-row{grid-template-columns:1fr;}}
  .kpi-tile{
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 16px 14px;
    background:var(--surface-sunken);
  }
  .kpi-label{font-size:11.5px;font-weight:650;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .kpi-value{font-size:24px;font-weight:700;letter-spacing:-0.01em;margin-bottom:6px;}
  .kpi-delta{font-size:12px;font-weight:650;display:flex;align-items:center;gap:4px;}
  .kpi-delta.up{color:#1f7a10;}
  .kpi-delta.down{color:var(--critical);}
  .kpi-delta.flat{color:var(--ink-muted);}

  /* Objective / finding / learning cards */
  .obj-card, .finding-card, .learning-card{display:flex;flex-direction:column;gap:12px;}
  .icon-tile{
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .obj-title, .finding-title, .learning-title{font-size:14.5px;font-weight:650;margin:0;}
  .obj-desc, .finding-desc, .learning-desc{font-size:13px;color:var(--ink-secondary);line-height:1.6;}
  .finding-tag{font-size:11px;color:var(--ink-muted);font-weight:600;margin-top:2px;}

  /* TARS */
  .tars-banner{
    display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--radius-sm);
    background:var(--violet-soft);color:var(--violet);font-size:13px;font-weight:600;margin-bottom:18px;
  }
  .tars-card{border-top:3px solid var(--accent);}
  .tars-card:nth-child(2){border-top-color:var(--aqua);}
  .tars-card:nth-child(3){border-top-color:var(--orange);}
  .tars-card:nth-child(4){border-top-color:var(--violet);}
  .tars-letter{font-size:26px;font-weight:800;color:var(--ink);opacity:.14;line-height:1;margin-bottom:2px;}
  .tars-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);margin-bottom:8px;}
  .tars-text{font-size:13.5px;color:var(--ink-secondary);line-height:1.62;}

  /* Table */
  .table-wrap{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-muted);padding:13px 18px;background:var(--surface-sunken);border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td{padding:15px 18px;border-bottom:1px solid var(--border);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-sunken);}
  .cell-primary{font-weight:600;color:var(--ink);}
  .cell-muted{color:var(--ink-secondary);font-size:12.8px;line-height:1.55;}
  .table-scroll{overflow-x:auto;}
  .rank-badge{
    width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }

  /* Progress bar */
  .progress-track{height:6px;border-radius:99px;background:var(--border);overflow:hidden;width:100%;min-width:80px;}
  .progress-fill{height:100%;border-radius:99px;background:var(--accent);}
  .progress-with-label{display:flex;align-items:center;gap:8px;}
  .progress-num{font-size:12.5px;font-weight:700;width:30px;text-align:right;flex-shrink:0;}

  /* Timeline */
  .timeline{position:relative;padding-left:30px;}
  .timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border-strong);}
  .tl-item{position:relative;padding-bottom:28px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot{
    position:absolute;left:-30px;top:2px;width:20px;height:20px;border-radius:50%;
    background:var(--surface);border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;
  }
  .tl-dot.done{border-color:var(--good);background:var(--good);}
  .tl-dot.active{border-color:var(--accent);}
  .tl-dot.active::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .tl-dot svg{width:11px;height:11px;color:#fff;}
  .tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px 18px;}
  .tl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
  .tl-phase{font-size:14.5px;font-weight:650;}
  .tl-date{font-size:12px;color:var(--ink-muted);font-weight:600;margin-top:2px;}
  .tl-desc{font-size:13px;color:var(--ink-secondary);line-height:1.6;margin-bottom:10px;}
  .tl-milestones{display:flex;flex-wrap:wrap;gap:6px;}
  .milestone-chip{font-size:11.5px;background:var(--surface-sunken);border:1px solid var(--border);color:var(--ink-secondary);padding:4px 9px;border-radius:999px;}

  /* Next steps */
  .step-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);}
  .step-row:last-child{border-bottom:none;}
  .step-check{
    width:20px;height:20px;border-radius:6px;border:2px solid var(--border-strong);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .step-check.done{background:var(--good);border-color:var(--good);}
  .step-check.progress{border-color:var(--accent);background:var(--accent-soft);}
  .step-check svg{width:12px;height:12px;color:#fff;}
  .step-main{flex:1;min-width:180px;}
  .step-task{font-size:13.5px;font-weight:600;}
  .step-owner{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .step-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .step-date{font-size:12px;color:var(--ink-secondary);font-weight:600;white-space:nowrap;}

  /* Roadmap */
  .roadmap-track{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.roadmap-track{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.roadmap-track{grid-template-columns:1fr;}}
  .rm-card{border-top:3px solid var(--border-strong);display:flex;flex-direction:column;gap:10px;min-height:170px;}
  .rm-card.status-active{border-top-color:var(--accent);}
  .rm-card.status-next{border-top-color:var(--orange);}
  .rm-card.status-future{border-top-color:var(--border-strong);}
  .rm-quarter{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);}
  .rm-title{font-size:14.5px;font-weight:650;}
  .rm-desc{font-size:12.8px;color:var(--ink-secondary);line-height:1.58;flex:1;}

  /* Footer */
  .footer{
    margin-top:72px;padding:30px 34px;border-radius:var(--radius-lg);
    background:var(--ink);color:#fff;
  }
  .footer-top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px;}
  .footer-brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:14px;}
  .footer-note{font-size:12.5px;color:rgba(255,255,255,0.55);max-width:420px;line-height:1.6;}
  .footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.12);}
  @media (max-width:700px){.footer-grid{grid-template-columns:1fr;}}
  .footer-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,0.45);font-weight:700;margin-bottom:8px;}
  .footer-value{font-size:13px;color:rgba(255,255,255,0.9);line-height:1.7;}
  .footer-participants{display:flex;flex-wrap:wrap;gap:6px;}
  .footer-chip{font-size:11.5px;background:rgba(255,255,255,0.08);padding:4px 9px;border-radius:999px;color:rgba(255,255,255,0.85);}

  .edit-hint{
    max-width:1180px;margin:20px auto 0;padding:0 24px;font-size:11.5px;color:var(--ink-muted);
  }
  .edit-hint code{background:var(--surface-sunken);border:1px solid var(--border);padding:1px 6px;border-radius:5px;}

  @media (max-width:700px){
    .hero{padding:24px 20px;}
    .grid-2{grid-template-columns:1fr;}
    thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{border-bottom:1px solid var(--border);padding:12px 0;}
    tbody td{border:none;padding:5px 18px;}
    tbody td::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin-bottom:3px;}
    .step-row{flex-wrap:wrap;}
    .step-meta{justify-content:flex-start;width:100%;padding-left:34px;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ================================================================================
   OBJETO DE DATOS DEL DOCUMENTO
   -------------------------------------------------------------------------------
   Edita únicamente el contenido de WORKSHOP_DATA para actualizar el documento.
   Ninguna otra parte del HTML/CSS/JS necesita tocarse: todas las 13 secciones
   se renderizan dinámicamente a partir de este objeto.
   ================================================================================ */
const WORKSHOP_DATA = {

  meta: {
    docTitle: "Page Pilot — Documento de Lanzamiento",
    brand: "Product Growth"
  },

  // 1. HEADER --------------------------------------------------------------
  header: {
    kicker: "Documento oficial · Workshop Estratégico de Lanzamiento",
    launchName: "Page Pilot — Creador de Páginas de Producto",
    tier: "Tier 1 · Estratégico",

  executiveSummary: {

    kpis: [
      { label: "Adopción del piloto", value: "34%", delta: "+8 pp vs. semana 1", trend: "up" },

      { label: "NPS del piloto", value: "8.2 / 10", delta: "+0.6 vs. Workshop 2", trend: "up" }
    ]
  },

  // 3. OBJETIVOS DEL WORKSHOP -------------------------------------------------
  objectives: [
    {
      icon: "compass",
      title: "Alinear la estrategia de adopción",
      description: "Unificar el criterio de Producto, Growth y Marketing sobre cómo llevar Page Pilot de piloto a lanzamiento general en Colombia."
    },
    {
      icon: "target",

      description: "Puntuar y ordenar las iniciativas propuestas por Impacto, Confianza y Facilidad para enfocar los primeros dos sprints."

    {
      icon: "sparkles",

    {
      icon: "book-open",

    {

      description: "Identificar en qué punto del journey se pierden más sellers después de exportar su primera página y definir mitigaciones."
    }
  ],

  // 4. RESUMEN ESTRATÉGICO (FRAMEWORK TARS) ------------------------------------
  tars: {
    frameworkNote: "Framework interno TARS — Tensión, Audiencia, Resultado esperado, Solución.",
    tension: "Los sellers con poca inversión inicial no logran crear páginas de producto atractivas ni testear ángulos de venta con rapidez, lo que limita su conversión y el uso recurrente de la plataforma.",

  },

  // 5. DECISIONES TOMADAS DURANTE EL WORKSHOP -----------------------------------
  decisions: [
    {
      decision: "Incluir un CTA directo en las cards de producto que redireccione de inmediato a Page Pilot.",
      area: "Producto / UX",

    },
    {

      area: "Marketing",
      owner: "María José Calderón",
      rationale: "Genera contenido desde ángulos que el equipo interno no había contemplado."
    },
    {
      decision: "Enseñar por Academy cómo generar ángulos de venta acordes al producto para robustecer la página.",
      area: "Educación",
      owner: "Catherin Salazar",
      rationale: "Los sellers no explotan hoy todo el potencial de páginas múltiples por producto."

    {

      rationale: "Hoy la prueba gratuita no se comunica en los momentos clave del journey."

function icon(name, sizeClass){
  const inner = ICONS[name] || ICONS["sparkles"];
  return '<svg class="icon ' + (sizeClass||'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';

/* ================================================================================
   HELPERS
   ================================================================================ */
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function slugify(str){
  return str.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function toneClass(prefix, tone){ return prefix + '-' + (tone || 'neutral'); }

function statusMap(kind, value){
  // Devuelve {label, tone, icon} normalizado para distintos tipos de estado
  const maps = {
    headerStatus: {
      "En Piloto": {tone:'accent', icon:'rocket'},
      "Activo": {tone:'good', icon:'check-circle'},
      "Pausado": {tone:'warning', icon:'clock'},
      "Completado": {tone:'good', icon:'check-circle'}
    },
    riskLevel: {
      critical: {tone:'critical', icon:'alert-triangle'},
      serious: {tone:'serious', icon:'alert-triangle'},
      warning: {tone:'warning', icon:'alert-triangle'},
      good: {tone:'good', icon:'check-circle'}
    },
    tlStatus: {
      done: {tone:'good', label:'Completado', icon:'check-circle'},
      active: {tone:'accent', label:'En curso', icon:'clock'},
      next: {tone:'neutral', label:'Próximo', icon:'flag'}
    },
    stepStatus: {
      done: {tone:'good', label:'Completado'},
      progress: {tone:'accent', label:'En progreso'},
      pending: {tone:'neutral', label:'Pendiente'}
    },
    priority: {
      "Alta": {tone:'critical'},
      "Media": {tone:'warning'},
      "Baja": {tone:'good'}
    },
    rmStatus: {
      active: {tone:'accent', label:'En curso'},
      next: {tone:'orange', label:'Próximo'},
      future: {tone:'neutral', label:'Futuro'}
    }
  };
  return (maps[kind] && maps[kind][value]) || {tone:'neutral', label:value, icon:'sparkles'};
}

function badge(text, tone, iconName){
  return '<span class="badge badge-' + tone + '">' + (iconName ? icon(iconName) : '') + esc(text) + '</span>';
}

/* ================================================================================

   ================================================================================ */
function renderTars(t){

    {letter:'T', label:'Tensión', text:t.tension},
    {letter:'A', label:'Audiencia', text:t.audience},
    {letter:'R', label:'Resultado esperado', text:t.result},
    {letter:'S', label:'Solución', text:t.solution}
  ];
  const cards = items.map(function(it){
    return (
      '<div class="card tars-card">' +
        '<div class="tars-letter">' + it.letter + '</div>' +

        '<p class="tars-text">' + esc(it.text) + '</p>' +
      '</div>'

    '<section>' +
      sectionHead('03', 'estrategia', 'Resumen Estratégico de la Funcionalidad', 'Basado en el framework interno TARS.', 'layers') +

/* ================================================================================
   RENDER: 5. DECISIONES TOMADAS
   ================================================================================ */
function renderDecisions(list){
  const rows = list.map(function(row){
    return (
      '<tr>' +
        '<td data-label="Decisión" class="cell-primary">' + esc(row.decision) + '</td>' +
        '<td data-label="Área">' + badge(row.area, 'accent') + '</td>' +
        '<td data-label="Responsable" class="cell-muted">' + esc(row.owner) + '</td>' +

      '<div class="table-wrap table-scroll"><table>' +

/* ================================================================================
   RENDER: 6. EXPERIMENTOS PRIORIZADOS (ICE)
   ================================================================================ */
function renderExperiments(list){
  const scored = list.map(function(e){
    const ice = (e.impact + e.confidence + e.ease) / 3;
    return Object.assign({}, e, {ice: ice});
  }).sort(function(a,b){ return b.ice - a.ice; });

  function miniBar(val){
    return (
      '<div class="progress-with-label">' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + (val*10) + '%"></div></div>' +
        '<div class="progress-num">' + val.toFixed(0) + '</div>' +
      '</div>'
    );
  }

  const rows = scored.map(function(e, i){
    return (
      '<tr>' +
        '<td data-label="#"><span class="rank-badge">' + (i+1) + '</span></td>' +
        '<td data-label="Experimento"><div class="cell-primary">' + esc(e.name) + '</div><div class="cell-muted">' + esc(e.description) + '</div></td>' +
        '<td data-label="Impacto">' + miniBar(e.impact) + '</td>' +
        '<td data-label="Confianza">' + miniBar(e.confidence) + '</td>' +
        '<td data-label="Facilidad">' + miniBar(e.ease) + '</td>' +
        '<td data-label="ICE"><span class="badge badge-violet">' + e.ice.toFixed(1) + '</span></td>' +
        '<td data-label="Responsable" class="cell-muted">' + esc(e.owner) + '</td>' +
        '<td data-label="Estado">' + badge(e.status, 'neutral') + '</td>' +
      '</tr>'
    );
  }).join('');

  return (
    '<section>' +
      sectionHead('05', 'experimentos', 'Experimentos Priorizados (ICE)', 'Impacto, Confianza y Facilidad en escala 1–10 · ordenados por score ICE.', 'target') +
      '<div class="table-wrap table-scroll"><table>' +
        '<thead><tr><th></th><th style="width:30%">Experimento</th><th>Impacto</th><th>Confianza</th><th>Facilidad</th><th>ICE</th><th>Responsable</th><th>Estado</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</section>'
  );
}

/* ================================================================================
   RENDER: 7. TIMELINE DEL LANZAMIENTO
   ================================================================================ */
function renderTimeline(list){
  const items = list.map(function(t){
    const st = statusMap('tlStatus', t.status);
    const dotClass = t.status === 'done' ? 'done' : (t.status === 'active' ? 'active' : '');
    const dotIcon = t.status === 'done' ? icon('check-circle') : '';
    const chips = t.milestones.map(function(m){ return '<span class="milestone-chip">' + esc(m) + '</span>'; }).join('');
    return (
      '<div class="tl-item">' +
        '<div class="tl-dot ' + dotClass + '">' + dotIcon + '</div>' +
        '<div class="tl-card">' +
          '<div class="tl-head">' +
            '<div><div class="tl-phase">' + esc(t.phase) + '</div><div class="tl-date">' + esc(t.date) + '</div></div>' +
            badge(st.label, st.tone, st.icon) +
          '</div>' +
          '<p class="tl-desc">' + esc(t.description) + '</p>' +
          '<div class="tl-milestones">' + chips + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  return (
    '<section>' +
      sectionHead('06', 'timeline', 'Timeline del Lanzamiento', 'Fases desde el descubrimiento hasta la expansión regional.', 'clock') +
      '<div class="timeline">' + items + '</div>' +
    '</section>'
  );
}

/* ================================================================================
   RENDER APP
   ================================================================================ */
function renderApp(){
  const d = WORKSHOP_DATA;
  document.title = d.meta.docTitle;

  const html = (
    renderTopbar(d) +
    '<div class="shell">' +
      renderHero(d.header) +
      renderExecutiveSummary(d.executiveSummary) +
      renderObjectives(d.objectives) +
      renderTars(d.tars) +
      renderDecisions(d.decisions) +
      renderExperiments(d.experiments) +
      renderTimeline(d.timeline) +
      renderFindings(d.findings) +
      renderRisks(d.risks) +
      renderNextSteps(d.nextSteps) +
      renderLearnings(d.learnings) +
      renderRoadmap(d.roadmap) +
      renderFooter(d.footer, d.meta) +
    '</div>'
  );

  document.getElementById('app').innerHTML = html;
  setupScrollSpy();
}

function setupScrollSpy(){
  const pills = Array.prototype.slice.call(document.querySelectorAll('.navpill'));
  const sections = SECTIONS_NAV.map(function(s){ return document.getElementById(s.id); }).filter(Boolean);
  if (!('IntersectionObserver' in window) || !sections.length) return;

  const observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting){
        const id = entry.target.id;
        pills.forEach(function(p){ p.classList.toggle('active', p.dataset.target === id); });
      }
    });
  }, { rootMargin: '-96px 0px -70% 0px', threshold: 0 });

  sections.forEach(function(s){ observer.observe(s); });
}

renderApp();
</script>
