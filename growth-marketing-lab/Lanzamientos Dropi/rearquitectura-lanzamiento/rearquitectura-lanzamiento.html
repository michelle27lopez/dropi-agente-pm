<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rearquitectura — Lanzamiento</title>
<style>
  :root{
    --page-bg:#f7f7f5;
    --surface:#ffffff;
    --surface-sunken:#fbfbfa;
    --surface-raised:#ffffff;
    --ink:#0b0b0b;
    --ink-secondary:#52514e;
    --ink-muted:#898781;
    --border:rgba(11,11,11,0.09);
    --border-strong:rgba(11,11,11,0.16);
    --accent:#2a78d6;
    --accent-soft:#eaf2fc;
    --violet:#4a3aa7;
    --violet-soft:#eeecf9;
    --aqua:#1baf7a;
    --aqua-soft:#e6f7f0;
    --orange:#eb6834;
    --orange-soft:#fdece4;
    --good:#0ca30c;
    --good-soft:#e7f6e3;
    --warning:#b9790a;
    --warning-soft:#fdf1da;
    --serious:#c85a34;
    --serious-soft:#fbe9e1;
    --critical:#d03b3b;
    --critical-soft:#fbe6e6;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(11,11,11,0.04), 0 1px 1px rgba(11,11,11,0.03);
    --shadow-md:0 4px 16px rgba(11,11,11,0.06), 0 1px 3px rgba(11,11,11,0.05);
    --shadow-lg:0 12px 32px rgba(11,11,11,0.10), 0 2px 6px rgba(11,11,11,0.06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sidebar-w: 264px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#131211;
      --surface:#1c1b19;
      --surface-sunken:#232220;
      --surface-raised:#28271f;
      --ink:#f3f2ef;
      --ink-secondary:#c2bfb6;
      --ink-muted:#8b877c;
      --border:rgba(255,255,255,0.09);
      --border-strong:rgba(255,255,255,0.16);
      --accent:#6ea4ea;
      --accent-soft:#20344f;
      --violet:#a596e8;
      --violet-soft:#2c2652;
      --aqua:#4fd3a0;
      --aqua-soft:#123529;
      --orange:#ff9a68;
      --orange-soft:#3d2517;
      --good:#5fd45f;
      --good-soft:#173319;
      --warning:#e8b04a;
      --warning-soft:#3a2c0e;
      --serious:#ef8f68;
      --serious-soft:#3a2117;
      --critical:#f2726b;
      --critical-soft:#3d1a17;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
      --shadow-md:0 4px 16px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.25);
      --shadow-lg:0 12px 32px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#131211;
    --surface:#1c1b19;
    --surface-sunken:#232220;
    --surface-raised:#28271f;
    --ink:#f3f2ef;
    --ink-secondary:#c2bfb6;
    --ink-muted:#8b877c;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --accent:#6ea4ea;
    --accent-soft:#20344f;
    --violet:#a596e8;
    --violet-soft:#2c2652;
    --aqua:#4fd3a0;
    --aqua-soft:#123529;
    --orange:#ff9a68;
    --orange-soft:#3d2517;
    --good:#5fd45f;
    --good-soft:#173319;
    --warning:#e8b04a;
    --warning-soft:#3a2c0e;
    --serious:#ef8f68;
    --serious-soft:#3a2117;
    --critical:#f2726b;
    --critical-soft:#3d1a17;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
    --shadow-md:0 4px 16px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.25);
    --shadow-lg:0 12px 32px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--page-bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  img,svg{display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  .icon{width:18px;height:18px;flex-shrink:0;}
  .icon-sm{width:14px;height:14px;}
  .icon-lg{width:22px;height:22px;}

  /* ============ SHELL / LAYOUT ============ */
  .shell{display:flex;min-height:100vh;}
  .main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:28px 32px 96px;}
  section{scroll-margin-top:24px;padding-top:8px;}
  @media (max-width:980px){ .shell{display:block;} .main{max-width:none;padding:20px 18px 80px;} }

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--surface);border-right:1px solid var(--border);padding:20px 14px 24px;
  }
  @media (max-width:980px){
    .sidebar{position:static;height:auto;width:100%;border-right:none;border-bottom:1px solid var(--border);
      display:flex;overflow-x:auto;overflow-y:hidden;padding:12px;gap:6px;}
    .sidebar-brand,.sidebar-foot{display:none;}
    .navlist{display:flex;gap:6px;}
    .navlist li{flex-shrink:0;}
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:650;font-size:14px;}
  .brand-mark{
    width:28px;height:28px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--violet));
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .brand-mark svg{width:16px;height:16px;}
  .brand-sub{font-size:11px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;}
  .navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .navlink{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:560;
    color:var(--ink-secondary);white-space:nowrap;transition:background .15s,color .15s;
  }
  .navlink:hover{background:var(--surface-sunken);color:var(--ink);}
  .navlink.active{background:var(--accent-soft);color:var(--accent);}
  .navlink .navnum{font-size:10.5px;font-weight:700;color:var(--ink-muted);width:16px;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .navlink.active .navnum{color:var(--accent);}
  .sidebar-foot{margin-top:18px;padding:12px 10px 4px;border-top:1px solid var(--border);}
  .theme-toggle{
    display:flex;gap:4px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:8px;padding:3px;
  }
  .theme-toggle button{
    flex:1;border:none;background:none;padding:6px 4px;border-radius:6px;font-size:11px;font-weight:650;cursor:pointer;color:var(--ink-muted);
  }
  .theme-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}

  /* ============ BADGES / TAGS ============ */
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:650;
    border:1px solid transparent;white-space:nowrap;
  }
  .badge svg{width:13px;height:13px;}
  .badge-neutral{background:var(--surface-sunken);color:var(--ink-secondary);border-color:var(--border);}
  .badge-accent{background:var(--accent-soft);color:var(--accent);}
  .badge-violet{background:var(--violet-soft);color:var(--violet);}
  .badge-aqua{background:var(--aqua-soft);color:var(--aqua);}
  .badge-good{background:var(--good-soft);color:var(--good);}
  .badge-warning{background:var(--warning-soft);color:var(--warning);}
  .badge-serious{background:var(--serious-soft);color:var(--serious);}
  .badge-critical{background:var(--critical-soft);color:var(--critical);}
  .badge-orange{background:var(--orange-soft);color:var(--orange);}

  /* status pills: definido / construccion / pendiente / propuesta */
  .status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.01em;}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .status-definido{background:var(--good-soft);color:var(--good);}
  .status-definido::before{background:var(--good);}
  .status-construccion{background:var(--warning-soft);color:var(--warning);}
  .status-construccion::before{background:var(--warning);}
  .status-pendiente{background:var(--critical-soft);color:var(--critical);}
  .status-pendiente::before{background:var(--critical);}
  .status-propuesta{background:var(--accent-soft);color:var(--accent);}
  .status-propuesta::before{background:var(--accent);}

  .src-tag{
    display:inline-flex;align-items:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-muted);border:1px solid var(--border);border-radius:5px;padding:2px 6px;white-space:nowrap;
    font-family:var(--font-mono);
  }
  .fact-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .fact-row .fact-text{flex:1;min-width:200px;}

  /* ============ HERO / PANEL EJECUTIVO ============ */
  .hero{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);padding:30px 32px;position:relative;overflow:hidden;margin-bottom:8px;
  }
  .hero::before{
    content:"";position:absolute;top:-70px;right:-70px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle, var(--accent-soft) 0%, transparent 72%);pointer-events:none;
  }
  .hero-kicker{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
  .hero-title{font-size:clamp(22px,3vw,30px);font-weight:750;letter-spacing:-0.015em;margin:0 0 10px;max-width:820px;text-wrap:balance;}
  .hero-sub{font-size:14px;color:var(--ink-secondary);max-width:720px;line-height:1.65;margin-bottom:20px;}
  .hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;}

  .exec-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1.2fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-top:22px;}
  @media (max-width:900px){.exec-grid{grid-template-columns:repeat(2,1fr);}}
  .exec-tile{background:var(--surface);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;}
  .exec-label{font-size:10.5px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;}
  .exec-value{font-size:17px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;}
  .exec-value.small{font-size:13px;font-weight:650;line-height:1.4;}
  .exec-progress{display:flex;align-items:center;gap:10px;}
  .exec-ring{position:relative;width:44px;height:44px;flex-shrink:0;}
  .exec-ring svg{width:44px;height:44px;transform:rotate(-90deg);}
  .exec-ring-track{fill:none;stroke:var(--border-strong);stroke-width:5;}
  .exec-ring-fill{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .4s;}
  .exec-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums;}

  /* ============ SECTION HEADINGS ============ */
  .section-head{margin:56px 0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .section-head:first-of-type{margin-top:40px;}
  .section-eyebrow{display:flex;align-items:center;gap:9px;color:var(--ink-muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
  .section-eyebrow .num{
    width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--page-bg);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .section-title{font-size:21px;font-weight:750;letter-spacing:-0.01em;margin:0;text-wrap:balance;}
  .section-sub{font-size:13.5px;color:var(--ink-secondary);margin-top:6px;max-width:680px;line-height:1.6;}

  /* ============ CARDS / GRIDS ============ */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);padding:20px;
  }
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-6{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:620px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr;}}

  .prose{font-size:13.5px;color:var(--ink-secondary);line-height:1.7;max-width:760px;}
  .prose strong{color:var(--ink);}
  .prose p{margin:0 0 10px;}
  .prose p:last-child{margin-bottom:0;}

  /* TARS */
  .tars-banner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--radius-sm);background:var(--violet-soft);color:var(--violet);font-size:13px;font-weight:600;margin-bottom:18px;}
  .tars-card{border-top:3px solid var(--accent);display:flex;flex-direction:column;gap:10px;}
  .tars-card:nth-child(2){border-top-color:var(--aqua);}
  .tars-card:nth-child(3){border-top-color:var(--orange);}
  .tars-card:nth-child(4){border-top-color:var(--violet);}
  .tars-letter{font-size:24px;font-weight:800;color:var(--ink);opacity:.16;line-height:1;}
  .tars-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);}
  .tars-text{font-size:13.2px;color:var(--ink-secondary);line-height:1.6;}

  .field-list{display:flex;flex-direction:column;gap:14px;}
  .field-item{border-bottom:1px solid var(--border);padding-bottom:14px;}
  .field-item:last-child{border:none;padding-bottom:0;}
  .field-label{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .field-value{font-size:13.5px;color:var(--ink);line-height:1.6;}

  /* comunicacion vs adopcion split */
  .split-compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  @media (max-width:700px){.split-compare{grid-template-columns:1fr;}}
  .split-col{background:var(--surface);padding:20px;}
  .split-col h4{margin:0 0 8px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .split-col p{margin:0;font-size:13px;color:var(--ink-secondary);line-height:1.6;}
  .split-col.a h4{color:var(--accent);}
  .split-col.b h4{color:var(--aqua);}

  /* Historia timeline */
  .story-track{position:relative;padding-left:26px;display:flex;flex-direction:column;gap:22px;}
  .story-track::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border-strong);}
  .story-step{position:relative;}
  .story-dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);}
  .story-step-title{font-size:14px;font-weight:700;margin-bottom:4px;}
  .story-step-text{font-size:13px;color:var(--ink-secondary);line-height:1.65;max-width:680px;}

  /* video brief */
  .video-brief{background:linear-gradient(135deg,var(--violet-soft),var(--accent-soft));border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;}
  .video-concept{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:750;margin-bottom:14px;flex-wrap:wrap;}
  .video-concept span{padding:5px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);}
  .video-concept svg{width:16px;height:16px;color:var(--ink-muted);}

  /* modulo cards */
  .modulo-card{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .modulo-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .modulo-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .modulo-name{font-size:15px;font-weight:750;}
  .modulo-need{font-size:12.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;font-weight:650;}
  .modulo-pp{font-size:13px;color:var(--ink-secondary);line-height:1.55;}
  .modulo-pp b{color:var(--ink);}

  .raw-notes{display:flex;flex-direction:column;gap:10px;}
  .raw-note{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface-sunken);}
  .raw-note-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px;}
  .raw-note-mod{font-size:11px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:.04em;}
  .raw-note-author{font-size:11px;color:var(--ink-muted);font-weight:600;}
  .raw-note-body{font-size:12.5px;color:var(--ink-secondary);line-height:1.6;white-space:pre-line;}

  /* audiencia */
  .kpi-tile{border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 16px 14px;background:var(--surface-sunken);}
  .kpi-label{font-size:11px;font-weight:650;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .kpi-value{font-size:24px;font-weight:750;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
  .kpi-sub{font-size:11.5px;color:var(--ink-muted);margin-top:4px;}

  .madurez-track{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  @media (max-width:900px){.madurez-track{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:520px){.madurez-track{grid-template-columns:repeat(2,1fr);}}
  .madurez-card{border-top:3px solid var(--border-strong);padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-height:118px;}
  .madurez-name{font-size:13px;font-weight:700;}
  .madurez-vol{font-size:11px;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .madurez-risk{margin-top:auto;}

  .axis-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .axis-row:last-child{border:none;}
  .axis-name{font-size:12.5px;font-weight:650;width:190px;flex-shrink:0;}
  .axis-bar{flex:1;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent-soft),var(--accent));position:relative;}
  .axis-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-muted);width:130px;flex-shrink:0;}

  .placeholder-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
    padding:32px 20px;border:1.5px dashed var(--border-strong);border-radius:var(--radius-md);background:var(--surface-sunken);
  }
  .placeholder-box svg{width:30px;height:30px;color:var(--ink-muted);}
  .placeholder-title{font-size:14px;font-weight:700;}
  .placeholder-text{font-size:12.5px;color:var(--ink-muted);max-width:420px;line-height:1.55;}

  /* journey */
  .journey-table{width:100%;border-collapse:collapse;font-size:13px;}
  .journey-table th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);padding:12px 16px;background:var(--surface-sunken);border-bottom:1px solid var(--border);}
  .journey-table td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-secondary);}
  .journey-table tr:last-child td{border-bottom:none;}
  .journey-table .hoy{color:var(--ink-muted);}
  .journey-table .futuro{color:var(--ink);font-weight:600;}

  .flow-behavior{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700;margin:4px 0 4px;}
  .flow-behavior span{padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
  .flow-behavior svg{width:15px;height:15px;color:var(--ink-muted);}

  /* comms tabs + timeline */
  .tabs{display:flex;gap:4px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content;}

  .hip-num{width:26px;height:26px;border-radius:8px;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;flex-shrink:0;}
  .hip-text{font-size:13.5px;color:var(--ink);line-height:1.65;}
  .hip-if{color:var(--accent);font-weight:700;}
  .hip-then{color:var(--aqua);font-weight:700;}

  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-sunken);}
  .cell-primary{font-weight:600;color:var(--ink);}
  .cell-muted{color:var(--ink-secondary);font-size:12.5px;line-height:1.5;}
  .cell-num{font-variant-numeric:tabular-nums;text-align:center;}
  .editable-input{
    width:100%;min-width:60px;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;
    font-size:12.8px;color:var(--ink);font-family:inherit;
  }
  .editable-input:hover{border-color:var(--border);}
  .editable-input:focus{border-color:var(--accent);background:var(--surface);outline:none;}
  select.editable-input{cursor:pointer;}
  .num-input{width:52px;text-align:center;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted);flex-shrink:0;
  }
  .icon-btn:hover{background:var(--surface-sunken);color:var(--ink);}
  .icon-btn svg{width:13px;height:13px;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:12.8px;font-weight:650;

  }
  .btn:hover{background:var(--surface-sunken);}

  .btn-primary{background:var(--ink);color:var(--page-bg);border-color:var(--ink);}

  .btn-ghost:hover{background:var(--surface-sunken);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}

  /* ICE matrix */
  .ice-wrap{display:grid;grid-template-columns:220px 1fr;gap:20px;}
  @media (max-width:800px){.ice-wrap{grid-template-columns:1fr;}}
  .ice-legend{display:flex;flex-direction:column;gap:10px;}
  .ice-legend .quad-tag{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;padding:8px 10px;border-radius:8px;background:var(--surface-sunken);border:1px solid var(--border);}
  .ice-legend .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .ice-plot{
    position:relative;aspect-ratio:1.3/1;background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--radius-md);
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  }
  .ice-quad{border:none;position:relative;}
  .ice-quad.qw{border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
  .ice-quad.ga{border-bottom:1px solid var(--border);}
  .ice-quad.rl{border-right:1px solid var(--border);}
  .quad-label{position:absolute;top:8px;left:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);}
  .ice-axis-label{position:absolute;font-size:10.5px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;}
  .ice-axis-y{left:-70px;top:50%;transform:rotate(-90deg) translateX(50%);transform-origin:left center;white-space:nowrap;}
  .ice-axis-x{bottom:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;}
  .ice-dot{
    position:absolute;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750;transform:translate(-50%,50%);
    box-shadow:var(--shadow-md);border:2px solid var(--surface);cursor:default;
  }

  /* marcas blancas / doc placeholder */
  .doc-card{display:flex;align-items:center;gap:14px;padding:16px 18px;}
  .doc-icon{width:40px;height:40px;border-radius:10px;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .doc-title{font-size:13.5px;font-weight:700;}
  .doc-desc{font-size:12px;color:var(--ink-muted);margin-top:2px;}

  /* roadmap */
  .roadmap-col{display:flex;flex-direction:column;gap:10px;}
  .roadmap-col-head{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);padding-bottom:8px;border-bottom:2px solid var(--border-strong);margin-bottom:4px;}
  .roadmap-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface);box-shadow:var(--shadow-sm);}
  .roadmap-item-title{font-size:12.8px;font-weight:650;margin-bottom:6px;}
  .roadmap-item-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--ink-muted);}

  /* pendientes list */
  .pending-list{display:flex;flex-direction:column;gap:2px;}
  .pending-item{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);}
  .pending-item:last-child{border:none;}
  .pending-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--critical);flex-shrink:0;margin-top:1px;}
  .pending-text{font-size:13.3px;color:var(--ink);line-height:1.5;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(11,11,11,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:750;}
  .modal-field{margin-bottom:14px;}
  .modal-field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .modal-field textarea, .modal-field input[type="text"]{
    width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;
    background:var(--surface);color:var(--ink);
  }
  .modal-field textarea{min-height:80px;resize:vertical;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .footer{margin-top:72px;padding:26px 30px;border-radius:var(--radius-lg);background:var(--ink);color:var(--page-bg);}
  .footer-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;}
  .footer-note{font-size:12px;color:rgba(255,255,255,0.55);}
  :root[data-theme="dark"] .footer-note, :root:not([data-theme="light"]) .footer-note{color:rgba(0,0,0,0.5);}
  .footer p{margin:0;font-size:12.5px;}

  .link-row{display:flex;flex-wrap:wrap;gap:8px;}

  @media (max-width:700px){
    .hero{padding:22px 20px;}
    .grid-2{grid-template-columns:1fr;}
    .exec-grid{grid-template-columns:repeat(2,1fr);}
    thead{display:none;}
    table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:100%;}
    table.stack tbody tr{border-bottom:1px solid var(--border);padding:10px 0;}
    table.stack td{border:none;padding:4px 14px;}
    table.stack td::before{content:attr(data-label);display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin-bottom:2px;}
  }
</style>
</head>

  entrevista:{
    fecha:"20 de agosto de 2026", participantes:"Catherin Salazar, Maria Ossa (CPO)",
    preguntas:[
      {q:"¿Por qué nació la Rearquitectura?", a:"Es la piedra angular del área de producto: consolida 3 años de trabajo para entender la evolución de Dropi. Decisión estratégica, no un cambio visual — necesaria para respaldar el crecimiento tras 6 años de plataforma."},
      {q:"¿Qué problema histórico estaba resolviendo?", a:"Dropi nació de una plantilla y creció orgánicamente; esa estructura, con el tiempo, limitó la escalabilidad. La rearquitectura reemplaza el modelo fragmentado por una consolidación organizada de procesos."},
      {q:"¿Cómo evolucionó Dropi?", a:"De plantilla inicial a plataforma con funcionalidades incorporadas de forma progresiva durante ~6-7 años, sin arquitectura unificada, hasta requerir reorganización."},
      {q:"¿Qué significa estratégicamente?", a:"Asegura que la arquitectura soporte futuras expansiones y esté alineada a los OKRs de Dropi — activación de usuarios y adopción de funcionalidades, no solo navegación."},
      {q:"¿Cómo se definieron los módulos?", a:"Ingeniería inversa sobre la cadena de valor del comercio electrónico: productos, marketing, logística, gestión de órdenes, informes, servicios financieros. Cada módulo responde a una necesidad específica del negocio del usuario."},
      {q:"¿Cuál es la narrativa que debemos comunicar?", a:"Dropi no cambia porque sí — evoluciona para acompañar el crecimiento del negocio del usuario. Concepto de “suite” integral de crecimiento, no una actualización visual."},
      {q:"¿Qué cambios de comportamiento esperamos?", a:"Que los usuarios antiguos cambien su forma de navegar sin perder confianza ni productividad, y que tanto usuarios antiguos como nuevos comprendan el valor de la plataforma agrupada por propósito."},
      {q:"¿Qué debe entender el usuario?", a:"Que la URL no cambia, su cuenta y operación continúan igual, y el cambio es de experiencia/navegación — organizado alrededor de sus necesidades de negocio, no una migración de sistema."},
      {q:"¿Qué no debemos comunicar?", a:"No presentar el cambio como “rediseño visual”. Evitar que el usuario sienta que “lo hackearon”, que “está en otra página” o que “perdió sus cosas” — el mensaje no es sobre estética, es sobre acompañar su crecimiento."}
    ]

function icon(name, cls){ return '<svg class="icon '+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.sparkles)+'</svg>'; }

/* ================================================================================
   HELPERS
   ================================================================================ */
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
function badge(text, tone, iconName){ return '<span class="badge badge-'+tone+'">'+(iconName?icon(iconName):'')+esc(text)+'</span>'; }
const STATUS_LABEL = {definido:'Definido', construccion:'En construcción', pendiente:'Pendiente', propuesta:'Propuesta'};
function statusPill(status){ return '<span class="status status-'+status+'">'+STATUS_LABEL[status]+'</span>'; }
function srcTag(text){ return text ? '<span class="src-tag">'+esc(text)+'</span>' : ''; }
function factRow(text, status, src){
  return '<div class="fact-row"><div class="fact-text">'+esc(text)+'</div>'+(status?statusPill(status):'')+(src?srcTag(src):'')+'</div>';
}

  return { experimentos: JSON.parse(JSON.stringify(DATA.experimentosSeed)), marcasBlancasDoc: null, theme: 'system' };

function computeProgress(){
  const w = {definido:1, construccion:0.5, pendiente:0};
  const total = DATA.checklist.length;
  const sum = DATA.checklist.reduce((a,c)=>a+w[c.status],0);
  return Math.round((sum/total)*100);
}

  if(e.impacto==null || e.confianza==null || e.esfuerzo==null) return null;
  return ((Number(e.impacto)+Number(e.confianza)+Number(e.esfuerzo))/3);
}

/* ================================================================================
   RENDER: 09. MATRIZ ICE
   ================================================================================ */
function renderIce(){
  const scored = STORE.experimentos.filter(e=>ice(e)!=null);
  const dots = scored.map(e=>{
    const s = ice(e);
    const impacto = Number(e.impacto), esfuerzo = Number(e.esfuerzo);
    const left = Math.min(96, Math.max(4, (esfuerzo/10)*100));
    const bottom = Math.min(96, Math.max(4, (impacto/10)*100));
    return '<div class="ice-dot" title="'+esc(e.hipotesis)+' — ICE '+s.toFixed(1)+'" style="left:'+left+'%;bottom:'+bottom+'%;">'+s.toFixed(1)+'</div>';
  }).join('');
  return (
    '<section id="ice">'+
      sectionHead('09','Matriz ICE — Impacto × Esfuerzo','Se actualiza sola al puntuar experimentos en la sección anterior.','target')+
      '<div class="ice-wrap">'+
        '<div class="ice-legend">'+
          '<div class="quad-tag"><span class="dot" style="background:var(--good);"></span>Quick Wins — alto impacto, bajo esfuerzo</div>'+
          '<div class="quad-tag"><span class="dot" style="background:var(--accent);"></span>Grandes apuestas — alto impacto, alto esfuerzo</div>'+
          '<div class="quad-tag"><span class="dot" style="background:var(--warning);"></span>Relleno — bajo impacto, bajo esfuerzo</div>'+
          '<div class="quad-tag"><span class="dot" style="background:var(--critical);"></span>No ahora — bajo impacto, alto esfuerzo</div>'+
        '</div>'+
        '<div>'+
          '<div class="ice-plot">'+
            '<div class="ice-quad qw"><span class="quad-label">Quick wins</span></div>'+
            '<div class="ice-quad ga"><span class="quad-label">Grandes apuestas</span></div>'+
            '<div class="ice-quad rl"><span class="quad-label">Relleno</span></div>'+
            '<div class="ice-quad na"><span class="quad-label">No ahora</span></div>'+
            (scored.length? dots : '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;"><span class="kpi-sub">Sin experimentos puntuados aún — asigna Impacto/Confianza/Esfuerzo en el backlog de experimentos.</span></div>')+
            '<span class="ice-axis-label ice-axis-y">Impacto →</span><span class="ice-axis-label ice-axis-x">Esfuerzo →</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</section>'
  );
}

      '<div class="doc-card card" style="margin-bottom:20px;">'+
        '<div class="doc-icon">'+icon('file')+'</div>'+
        '<div style="flex:1;"><div class="doc-title">Entrevista completa — Cuéntame un poco de la historia (Notas de Gemini)</div><div class="doc-desc">'+esc(DATA.entrevista.fecha)+' · '+esc(DATA.entrevista.participantes)+' — pídela a Catherin (Drive) para subirla como recurso descargable aquí.</div></div>'+
      '</div>'+
      '<div class="card"><div class="field-list">'+qas+'</div></div>'+
      '<div class="section-head" style="margin:36px 0 12px;"><h3 class="section-title" style="font-size:15px;">Convención de etiquetas usada en todo el artefacto</h3></div>'+
      '<div class="grid grid-4">'+
        '<div class="card">'+statusPill('definido')+'<p class="kpi-sub" style="margin-top:8px;">Decidido y confirmado.</p></div>'+
        '<div class="card">'+statusPill('construccion')+'<p class="kpi-sub" style="margin-top:8px;">Parcialmente definido.</p></div>'+
        '<div class="card">'+statusPill('pendiente')+'<p class="kpi-sub" style="margin-top:8px;">Sin definir todavía.</p></div>'+
        '<div class="card">'+statusPill('propuesta')+'<p class="kpi-sub" style="margin-top:8px;">Idea del equipo, no decisión final.</p></div>'+
      '</div>'+

  );
}

function sectionHead(num, title, sub, iconName){
  return (
    '<div class="section-head">'+
      '<div><div class="section-eyebrow"><span class="num">'+num+'</span>'+icon(iconName)+'</div>'+
      '<h2 class="section-title">'+esc(title)+'</h2>'+
      (sub?'<div class="section-sub">'+esc(sub)+'</div>':'')+
      '</div>'+
    '</div>'
  );
}

/* ================================================================================
   RENDER APP
   ================================================================================ */
function renderApp(){
  document.title = DATA.meta.docTitle;
  const html = (
    '<div class="shell">'+
      renderSidebar()+
      '<main class="main">'+
        renderHero()+
        renderTars()+
        renderHistoria()+
        renderArquitectura()+
        renderAudiencias()+
        renderJourney()+
        renderComunicacion()+
        renderHipotesis()+
        renderExperimentos()+
        renderIce()+
        renderMedicion()+
        renderInsumos()+
        renderMarcasBlancasSection()+
        renderProximaMesa()+
        renderDocumentacion()+
        '<footer class="footer"><div class="footer-row"><p>Rearquitectura de Dropi — Centro de Comando · Product Growth Marketing</p><p class="footer-note">Los cambios en Experimentos y Marcas Blancas se guardan en este navegador.</p></div></footer>'+
      '</main>'+
    '</div>'
  );
  document.getElementById('app').innerHTML = html;
  renderMarcasBlancasBox();
  mirrorMarcasBlancasBox2();
  setupScrollSpy();
  setupTabs();
  setupThemeToggle();
  setupExperimentTable();
  setupModuloModal();
}
function mirrorMarcasBlancasBox2(){
  const b1 = document.getElementById('marcasBlancasBox');
  const b2 = document.getElementById('marcasBlancasBox2');
  if(b1 && b2) b2.innerHTML = b1.innerHTML;
}

function setupScrollSpy(){
  const links = Array.prototype.slice.call(document.querySelectorAll('.navlink'));
  const sections = NAV.map(s=>document.getElementById(s.id)).filter(Boolean);
  if(!('IntersectionObserver' in window) || !sections.length) return;
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id;
        links.forEach(l=>l.classList.toggle('active', l.dataset.target===id));
      }
    });
  }, {rootMargin:'-10% 0px -75% 0px', threshold:0});
  sections.forEach(s=>obs.observe(s));
}

function setupTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tab = btn.dataset.tab;
      const parent = btn.closest('.tabs').parentElement;
      parent.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b===btn));
      parent.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.dataset.panel===tab));
    });
  });
}

function setupThemeToggle(){
  const wrap = document.getElementById('themeToggle');
  if(!wrap) return;
  function apply(mode){
    if(mode==='light') document.documentElement.setAttribute('data-theme','light');
    else if(mode==='dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
    wrap.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
    STORE.theme = mode; saveStore();
  }
  wrap.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>apply(b.dataset.mode)));
  apply(STORE.theme||'system');
}

function setupExperimentTable(){
  const table = document.getElementById('expTable');
  if(!table) return;
  table.addEventListener('input', e=>{
    const field = e.target.dataset.field;
    if(!field) return;
    const tr = e.target.closest('tr');
    const id = tr.dataset.id;
    const exp = STORE.experimentos.find(x=>x.id===id);
    if(!exp) return;
    if(field==='impacto'||field==='confianza'||field==='esfuerzo'){
      exp[field] = e.target.value===''? null : Number(e.target.value);
    } else {
      exp[field] = e.target.value;
    }
    saveStore();
    if(field==='impacto'||field==='confianza'||field==='esfuerzo'){
      const iceSection = document.getElementById('ice');
      if(iceSection) iceSection.outerHTML = renderIce();
      const tdIce = tr.querySelector('td:nth-child(11)');
      const s = ice(exp);
      tdIce.innerHTML = s!=null ? '<span class="badge badge-violet">'+s.toFixed(1)+'</span>' : '<span class="kpi-sub">—</span>';
    }
  });
  table.addEventListener('click', e=>{
    const btn = e.target.closest('[data-action="delete"]');
    if(!btn) return;
    const tr = btn.closest('tr');
    const id = tr.dataset.id;
    if(!confirm('¿Eliminar este experimento del backlog?')) return;
    STORE.experimentos = STORE.experimentos.filter(x=>x.id!==id);
    saveStore();
    tr.remove();
    const iceSection = document.getElementById('ice');
    if(iceSection) iceSection.outerHTML = renderIce();
  });
  const addBtn = document.getElementById('addExpBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    STORE.experimentos.push({id:uid(), hipotesis:'Nuevo experimento', experimento:'', segmento:'', control:'', tratamiento:'', canal:'', kpi:'', impacto:null, confianza:null, esfuerzo:null, responsable:'', estado:'Por definir'});
    saveStore();
    const section = document.getElementById('experimentos');
    if(section) section.outerHTML = renderExperimentos();
    setupExperimentTable();
  });
}

function setupModuloModal(){
  document.querySelectorAll('[data-modal="modulo"]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const m = DATA.modulos.find(x=>x.id===card.dataset.id);
      if(!m || !m.promesa) return;
      openModal(
        '<h3>'+esc(m.nombre)+'</h3>'+
        '<div class="field-list">'+
          '<div class="field-item"><div class="field-label">Problema</div><div class="field-value">'+esc(m.problema)+'</div></div>'+
          '<div class="field-item"><div class="field-label">Promesa</div><div class="field-value">'+esc(m.promesa)+'</div></div>'+
          (m.accion? '<div class="field-item"><div class="field-label">Acción</div><div class="field-value">'+esc(m.accion)+'</div></div>' : '')+
          (m.resultado? '<div class="field-item"><div class="field-label">Resultado</div><div class="field-value">'+esc(m.resultado)+'</div></div>' : '')+
        '</div>'+
        '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>'
      );
    });
  });
}

/* ================================================================================
   MODAL genérico + Marcas Blancas
   ================================================================================ */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

function openMarcasBlancasModal(){
  openModal(
    '<h3>Agregar documentación de Marcas Blancas</h3>'+
    '<div class="modal-field"><label>Título del documento</label><input type="text" id="mbTitulo" placeholder="Ej: Brief de comunicación Marcas Blancas"></div>'+
    '<div class="modal-field"><label>Enlace (Drive, Figma, Notion...)</label><input type="text" id="mbUrl" placeholder="https://..."></div>'+
    '<div class="modal-field"><label>Nota</label><textarea id="mbNota" placeholder="Contexto breve..."></textarea></div>'+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="mbSave">Guardar</button></div>'
  );
  document.getElementById('mbSave').addEventListener('click', ()=>{
    const titulo = document.getElementById('mbTitulo').value.trim();
    if(!titulo){ document.getElementById('mbTitulo').focus(); return; }
    STORE.marcasBlancasDoc = {
      titulo,
      url: document.getElementById('mbUrl').value.trim(),
      nota: document.getElementById('mbNota').value.trim()
    };
    saveStore();
    closeModal();
    renderMarcasBlancasBox();
    mirrorMarcasBlancasBox2();
  });
}
function removeMarcasBlancasDoc(){
  if(!confirm('¿Quitar este documento?')) return;
  STORE.marcasBlancasDoc = null;
  saveStore();
  renderMarcasBlancasBox();
  mirrorMarcasBlancasBox2();
}

renderApp();
</script>
