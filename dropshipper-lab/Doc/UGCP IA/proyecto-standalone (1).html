  <script>
(function () {
  const p = JSON.parse(document.getElementById('proyecto-data').textContent);
  const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  document.getElementById('header').innerHTML = `
    <h1>${esc(p.project.displayName)}</h1>
    <p class="meta">${esc(p.project.description)}</p>
    <p class="meta">Generado: ${esc(p.meta.generatedAt)} · v${esc(p.meta.version)} · <span class="badge">CONFIDENCIAL</span> · <span class="badge">STANDALONE</span></p>
    <p class="meta">${esc(p.meta.purpose)}</p>
  `;

  const routes = p.routes.map(r => `<tr><td><code>${esc(r.path)}</code></td><td>${esc(r.page)}</td><td>${esc(r.feature)}</td></tr>`).join('');
  const overlays = p.globalOverlays.map(o => `<li><code>${esc(o.component)}</code> — ${esc(o.description)}</li>`).join('');
  const phases = p.architecture.phases.map(ph => `<h3>${esc(ph.name)} <code>${esc(ph.path)}</code></h3><p>${esc(ph.description)}</p>`).join('');
  const dirs = Object.entries(p.architecture.directories).map(([k,v]) => `<li><code>${esc(k)}</code> — ${esc(v)}</li>`).join('');
  const state = p.stateManagement.highlights.map(h => `<li>${esc(h)}</li>`).join('');
  const iaFlow = p.wizardSteps.iaFlow.map(s => `<li>${esc(s)}</li>`).join('');
  const comps = Object.entries(p.keyComponents).map(([area, items]) =>
    `<h3>${esc(area)}</h3><ul>${items.map(i => `<li><code>${esc(i)}</code></li>`).join('')}</ul>`).join('');
  const docs = p.documents.map(d => `<li><code>${esc(d.path)}</code> — ${esc(d.summary)}</li>`).join('');
  const sourceFiles = p.sourceFiles.map(f => `<code>${esc(f)}</code>`).join('');
  const fileTree = p.fileTree.map(f => `<code>${esc(f)}</code>`).join('');

  document.getElementById('panel-doc').innerHTML = `
    <section><h2>Comandos</h2><ul>
      <li><code>${esc(p.commands.install)}</code> — instalar</li>
      <li><code>${esc(p.commands.dev)}</code> — desarrollo</li>
      <li><code>${esc(p.commands.build)}</code> — build</li>
    </ul></section>
    <section><h2>Stack</h2><ul>
      <li>${esc(p.stack.framework)} + ${esc(p.stack.language)}</li>
      <li>${esc(p.stack.bundler)}</li>
      <li>Estilos: ${esc(p.stack.styling.join(', '))}</li>
      <li>UI: ${esc(p.stack.ui.join('; '))}</li>
      <li>Estado: ${esc(p.stack.state)} · Rutas: ${esc(p.stack.routing)}</li>
      <li>Alias <code>@</code> → <code>${esc(p.stack.alias['@'])}</code></li>
    </ul>
    <p class="meta">Entry: <code>${esc(p.entryPoints.main)}</code> · <code>${esc(p.entryPoints.app)}</code></p></section>
    <section><h2>Rutas</h2>
      <table><thead><tr><th>Ruta</th><th>Página</th><th>Descripción</th></tr></thead><tbody>${routes}</tbody></table>
      <h3>Overlays</h3><ul>${overlays}</ul></section>
    <section><h2>Arquitectura</h2>${phases}
      <h3>Directorios</h3><ul>${dirs}</ul></section>
    <section><h2>Estado (Zustand)</h2>
      <p><code>${esc(p.stateManagement.store)}</code></p>
      <ul>${state}</ul>
      <p class="meta">${esc(p.stateManagement.note)}</p></section>
    <section><h2>Wizard Fase 2</h2>
      <p><code>${esc(p.wizardSteps.step0.file)}</code>: ${esc(p.wizardSteps.step0.options.join(' · '))}</p>
      <h3>Flujo IA</h3><ol>${iaFlow}</ol>
      <p class="meta">${esc(p.wizardSteps.monomoFlow)}</p></section>
    <section><h2>Componentes</h2>${comps}
      <h3>Hooks canvas</h3><p>${p.canvasHooks.map(h => '<code>'+esc(h)+'</code>').join(' · ')}</p></section>
    <section><h2>Figma</h2><ul>
      <li>Canvas: <code>${esc(p.figma.canvasFase1)}</code></li>
      <li>Detalles: <code>${esc(p.figma.detallesAltaFidelidad)}</code></li>
      <li>Wireframes: <code>${esc(p.figma.wireframesFase2)}</code></li>
    </ul>
    <p><span class="badge">Canvas</span> ${esc(p.designTokens.canvasAccent)} · <span class="badge purple">Biblioteca</span> ${esc(p.designTokens.libraryAccent)}</p></section>
    <section><h2>Docs en repo</h2><ul>${docs}</ul></section>
    <section><h2>Archivos fuente (${p.fileCounts.sourceTsTsx})</h2>
      <div class="files">${sourceFiles}</div></section>
    <section><h2>Árbol completo (${p.fileCounts.total})</h2>
      <details><summary>Ver todos los archivos</summary>
      <div class="files" style="margin-top:0.75rem">${fileTree}</div></details></section>
    <section><h2>Instrucciones agente</h2><ol>
      <li>Extraer JSON de la pestaña "JSON embebido" o del <code>&lt;script id="proyecto-data"&gt;</code>.</li>
      <li>Leer <code>PLAN.md</code> en el repo para diagrama Mermaid.</li>
      <li>Wizard = overlay; rutas en <code>App.tsx</code>.</li>
      <li>Sin backend; Zustand en sesión.</li>
      <li>Tema naranja (canvas) vs morado (biblioteca).</li>
      <li>Multi-selección máx. 5.</li>
    </ol></section>
  `;

  const pretty = JSON.stringify(p, null, 2);
  document.getElementById('json-raw').textContent = pretty;

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  const toast = document.getElementById('toast');
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  document.getElementById('copy-json').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(pretty);
      showToast('JSON copiado');
    } catch {
      showToast('Error al copiar');
    }
  });

  document.getElementById('download-json').addEventListener('click', () => {
    const blob = new Blob([pretty], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.project.name || 'proyecto') + '-handoff.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Descarga iniciada');
  });
})();
  </script>
