<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear Campaña · Dinámicas de Catálogo</title>
  <style>
    :root {
      --dropi: #F77F00;
      --dropi-light: #FFF3E0;
      --bg: #F8F9FA;
      --border: #E5E7EB;
      --fg: #111827;
      --muted: #6B7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* ── Header ── */
    #hdr {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #hdr .back { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0; font-family: inherit; }
    #hdr .sep  { color: var(--border); font-size: 14px; }
    #hdr .name { font-size: 13px; font-weight: 700; color: var(--fg); }
    #hdr .prog { margin-left: 4px; font-size: 11px; font-weight: 600; color: var(--dropi); background: #FFF3E0; padding: 2px 8px; border-radius: 20px; }
    /* ── Layout ── */
    #layout { flex: 1; display: flex; overflow: hidden; }
    /* ── Graph panel ── */
    #graph-panel {
      width: 300px;
      background: #FAFAFA;
      background-image: radial-gradient(circle, #d1d5db 1px, transparent 1px);
      background-size: 20px 20px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
    }
    #graph-svg { display: block; }
    /* ── Form panel ── */
    #form-panel { flex: 1; overflow-y: auto; padding: 36px 40px; }
    /* ── Node header card ── */
    .nhc {
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 24px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .nhc-icon {
      width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
      background: #FFF3E0; display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .nhc-badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      color: var(--dropi); background: #FFF3E0; padding: 2px 8px;
      border-radius: 20px; margin-bottom: 4px;
    }
    .nhc-title { font-size: 18px; font-weight: 700; color: var(--fg); margin-bottom: 4px; }
    .nhc-desc  { font-size: 13px; color: var(--muted); line-height: 1.5; }
    /* ── Form card ── */
    .fc { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    /* ── Fields ── */
    .fld { margin-bottom: 20px; }
    .fld:last-of-type { margin-bottom: 0; }
    .fld-label { display: block; font-size: 12px; font-weight: 700; color: var(--fg); margin-bottom: 8px; }
    .fld-req   { color: var(--dropi); margin-left: 2px; }
    .fld-hint  { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
    input[type=text], input[type=date], input[type=number], textarea, select {
      width: 100%; border: 1px solid var(--border); border-radius: 9px;
      padding: 10px 14px; font-size: 14px; outline: none;
      font-family: inherit; background: #fff; color: var(--fg);
      transition: border-color .12s;
    }
    input[type=text]:focus, input[type=date]:focus, input[type=number]:focus,
    textarea:focus, select:focus { border-color: var(--dropi); }
    textarea { resize: vertical; }
    select   { cursor: pointer; }
    .opt-desc {
      margin-top: 8px; padding: 10px 14px;
      background: #FFF8F0; border: 1px solid rgba(247,127,0,.18);
      border-radius: 9px; font-size: 13px; color: #7a4f1e; line-height: 1.5;
      display: none;
    }
    /* ── Dates grid ── */
    .dates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dates-grid .dg-label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 6px; }
    .dates-grid input  { padding: 9px 12px; font-size: 13px; }
    /* ── Multiselect ── */
    .ms-selected { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .ms-chip {
      display: flex; align-items: center; gap: 5px;
      background: #FFF3E0; border: 1.5px solid var(--dropi);
      border-radius: 20px; padding: 5px 12px;
    }
    .ms-chip-rank { font-size: 10px; font-weight: 800; color: #fff; border-radius: 10px; padding: 1px 6px; flex-shrink: 0; }
    .ms-chip-rank.pr { background: var(--dropi); }
    .ms-chip-rank.sc { background: #bbb; }
    .ms-chip-name { font-size: 13px; font-weight: 600; color: var(--dropi); }
    .ms-chip-rm   { background: none; border: none; cursor: pointer; color: rgba(247,127,0,.5); font-size: 15px; padding: 0; line-height: 1; }
    .ms-all { display: flex; flex-wrap: wrap; gap: 8px; }
    .ms-opt {
      padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: #fff; color: var(--muted); font-size: 13px; font-weight: 400;
      cursor: pointer; transition: all .12s; font-family: inherit;
    }
    .ms-opt.on {
      border-color: var(--dropi); background: #FFF3E0;
      color: var(--dropi); font-weight: 700;
    }
    .ms-opt.on.rk { border-color: transparent; background: #f0f0f0; color: #999; text-decoration: line-through; }
    .ms-hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    /* ── Condition builder ── */
    .cb-wrap { display: flex; flex-direction: column; gap: 8px; }
    .cb-row  { display: flex; align-items: center; gap: 6px; }
    .cb-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; min-width: 36px; text-align: center; }
    .cb-badge.AND { color: #1d4ed8; background: #eff6ff; }
    .cb-badge.OR  { color: #7c3aed; background: #f5f3ff; }
    .cb-sp   { width: 36px; flex-shrink: 0; }
    .cb-item {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: #f9fafb; border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 14px;
    }
    .cb-f  { font-size: 13px; color: #374151; font-weight: 600; }
    .cb-op { font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .cb-op.AND { color: #1d4ed8; }
    .cb-op.OR  { color: #7c3aed; }
    .cb-v  { font-size: 13px; color: #111827; }
    .cb-rm { margin-left: auto; background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 17px; padding: 0; line-height: 1; }
    .cb-add-row {
      flex: 1; display: flex; gap: 6px; align-items: center;
      background: #fff; border: 1.5px dashed var(--border);
      border-radius: 9px; padding: 8px 10px;
    }
    .cb-add-row select { flex: 0 0 auto; border-radius: 7px; padding: 6px 10px; font-size: 13px; }
    .cb-add-row select.cb-sel-f  { flex: 2; }
    .cb-add-row select.cb-sel-op { min-width: 90px; }
    .cb-add-row input  { flex: 1; border-radius: 7px; padding: 6px 10px; font-size: 13px; }
    .cb-add-btn {
      background: #e5e7eb; color: #9ca3af; border: none; border-radius: 7px;
      padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: default;
      flex-shrink: 0; transition: all .12s; font-family: inherit;
    }
    .cb-add-btn.ok { background: var(--dropi); color: #fff; cursor: pointer; }
    .cb-empty { font-size: 12px; color: #9ca3af; margin-left: 42px; }
    /* ── Static field ── */
    .fld-static {
      background: #FFF3E0; border: 1px solid rgba(247,127,0,.18);
      border-radius: 9px; padding: 10px 14px; font-size: 14px;
      color: var(--dropi); font-weight: 600;
    }
    /* ── Actions ── */
    .form-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);
    }
    .btn-prev {
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
      padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--fg); font-family: inherit; transition: all .12s;
    }
    .btn-prev:disabled { color: var(--muted); cursor: default; opacity: .6; }
    .btn-next {
      background: var(--dropi); color: #fff; border: none; border-radius: 9px;
      padding: 10px 24px; font-size: 13px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: opacity .12s;
    }
    .btn-next:hover { opacity: .88; }
  </style>
</head>
<body>

<header id="hdr">
  <button class="back">← Campañas</button>
  <span class="sep">/</span>
  <span class="name" id="hdr-name">Campaña Prototipo</span>
  <span class="prog" id="hdr-prog">Nodo 1 de 8</span>
</header>

<div id="layout">
  <aside id="graph-panel">
    <svg id="graph-svg"></svg>
  </aside>
  <main id="form-panel"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════
   DATA — NODE DEFINITIONS (from nodes.ts)
═══════════════════════════════════════════════════ */
const NODES = [
  {
    key:"base", title:"Ficha base", icon:"➕",
    description:"Define la identidad de la campaña. Qué es, para qué existe y cuándo ocurre. Aquí se fija el objetivo único — no se vuelve a preguntar en los siguientes nodos.",
    fields:[
      { key:"name", label:"Nombre de la campaña", type:"text", required:true, placeholder:"ej. Día del Padre · Dropicup Mundial · Remates de Stock · Black Week" },
      { key:"short_description", label:"Descripción corta", type:"textarea", required:true, placeholder:"¿Qué busca esta campaña en una frase?", hint:"ej. Campaña para agrupar productos relacionados con regalos masculinos y validar si una vitrina curada aumenta la adopción de dropshippers." },
      { key:"commercial_event", label:"Fecha comercial o evento", type:"text", required:true, placeholder:"ej. Día del Padre · Black Friday · Temporada escolar · Remate de fin de mes", hint:"Si no está asociada a una fecha comercial específica, describe el evento o contexto." },
      { key:"country", label:"Países donde aplica", type:"multiselect", required:true, hint:"Validar que los países compartan la fecha o contexto comercial antes de seleccionar.", options:["Colombia","México","Chile","Argentina","Perú","Venezuela","Costa Rica","Panamá","Paraguay","Ecuador","Bolivia"] },
      { key:"responsible", label:"Responsable general de la campaña", type:"select", required:true, options:["Producto","Growth","Comercial","Supplier Success","Comunicaciones"] },
      { key:"objective", label:"Objetivo único de la campaña", type:"select", required:true,
        hint:"Una campaña = un objetivo. No mezcles. Si necesitas varios objetivos, crea campañas separadas.",
        options:["Aumentar órdenes","Generar GMV","Activar productos quietos","Dar visibilidad a suppliers","Ayudar a suppliers a salir de stock","Activar suppliers nuevos","Validar una categoría específica","Validar descuentos como palanca"],
        optionDescriptions:{
          "Aumentar órdenes":"Campañas masivas de temporada (Día de la Madre, Black Week, Día del Padre). Miden si la vitrina genera más órdenes en el período.",
          "Generar GMV":"Cuando el foco es el valor monetario total, no solo el volumen de órdenes. Útil para campañas de alto ticket.",
          "Activar productos quietos":"Productos publicados sin órdenes en 30/60/90 días. Objetivo: pasar de 'publicado' a 'con orden'.",
          "Dar visibilidad a suppliers":"El beneficio para el supplier es la exposición. No requiere descuento. Valida si la visibilidad sola genera participación.",
          "Ayudar a suppliers a salir de stock":"Remates. El supplier tiene inventario acumulado y necesita moverlo con precio especial.",

          "Validar una categoría específica":"Campañas por vertical: hogar, belleza, tecnología, mascotas. Miden si hay demanda diferenciada por categoría.",
          "Validar descuentos como palanca":"¿Un descuento real genera adopción diferencial vs productos sin descuento? Experimento controlado.",
        }
      },
      { key:"hypothesis", label:"Hipótesis", type:"textarea", required:true, placeholder:"Si [acción], entonces [resultado esperado], porque [razón].", hint:"ej. Si Dropi crea una vitrina curada de Día del Padre, los dropshippers tendrán mayor intención de explorar esos productos, generando órdenes incrementales." },
      { key:"expected_result", label:"Resultado esperado", type:"textarea", required:true, placeholder:"¿Qué números o señales confirmarían que la campaña funcionó?", hint:"ej. Mínimo 20 suppliers participantes, 60+ productos aprobados, 30+ órdenes en la primera semana." },
    ]
  },
  {
    key:"type", title:"Tipo y mecánica", icon:"🏷️",
    description:"Clasifica la dinámica comercial y define si requiere descuento y cuál es el motivador principal para el supplier. No repite el objetivo — ese ya quedó en la ficha base.",
    fields:[
      { key:"campaign_type", label:"Tipo de dinámica", type:"select", required:true,
        options:["Temporada","Remate","Visibilidad","Por categoría","Productos quietos","Suppliers nuevos","Alto margen","Combos","Por proveedor destacado","Mixta"],
        optionDescriptions:{
          "Temporada":"Alrededor de una fecha comercial (Black Week, Navidad, Día del Padre…). Mueve órdenes con contexto claro para pautar. Descuento opcional.",

          "Visibilidad":"El beneficio es la exposición en vitrina curada. Valida si el supplier participa solo por visibilidad, sin descuento.",
          "Por categoría":"Agrupa productos por vertical temática. Facilita al dropshipper encontrar productos con una intención de venta clara.",
          "Productos quietos":"Productos publicados sin órdenes en 30/60/90 días. Objetivo: activarlos.",

      { key:"has_expiration", label:"¿Tiene fecha de cierre?", type:"select", required:true, hint:"Se recomienda que todas las campañas tengan fecha de cierre. Las fechas exactas se definen en el nodo Calendario.", options:["Sí","No"] },

  {
    key:"submission", title:"Postulación de productos", icon:"📝",
    description:"Define cómo entran los productos a la campaña y qué datos se capturan. Puede ser el supplier quien postula o el equipo quien selecciona internamente.",
    fields:[
      { key:"submission_channel", label:"Mecanismo de captura", type:"select", required:true,

   STATE
═══════════════════════════════════════════════════ */
const S = {
  active: 0,         // current node index
  maxReached: 0,     // furthest node reached
  completed: new Set(),
  data: {},          // nodeIdx -> { fieldKey -> value }
  draft: {},         // "nodeIdx|fieldKey" -> { f, op, val }
};

function nd(){ return S.data[S.active] || (S.data[S.active] = {}); }
function dk(fieldKey){ return `${S.active}|${fieldKey}`; }
function getDraft(k){ return S.draft[k] || (S.draft[k] = {f:"",op:"",val:""}); }
function setDraft(k, patch){ S.draft[k] = {...getDraft(k),...patch}; }
function getConds(fieldKey){ try{ return JSON.parse(nd()[fieldKey])||[]; }catch{return [];} }
function saveConds(fieldKey, conds){ nd()[fieldKey] = JSON.stringify(conds); }

function saveTextFromDOM(){
  const node = NODES[S.active];
  node.fields.forEach(f=>{
    if(f.type==="text"||f.type==="textarea"){
      const el=document.getElementById(`f_${f.key}`);
      if(el) nd()[f.key]=el.value;
    } else if(f.type==="dates_group"){
      (f.subfields||[]).forEach(sf=>{
        const el=document.getElementById(`f_${sf.key}`);
        if(el) nd()[sf.key]=el.value;
      });
    }
  });
}

/* ═══════════════════════════════════════════════════
   GRAPH SVG
═══════════════════════════════════════════════════ */
const NW=220, NH=64, GY=48, PX=40, PY=24;

function renderGraph(){
  const n = NODES.length;
  const totalH = PY*2 + n*NH + (n-1)*GY;
  const svgEl = document.getElementById("graph-svg");
  svgEl.setAttribute("width", NW+PX*2);
  svgEl.setAttribute("height", totalH);

  let html = "";
  NODES.forEach((node,idx)=>{
    const done = S.completed.has(idx);
    const active = idx===S.active;
    const x=PX, y=PY+idx*(NH+GY);
    const cx=x+NW/2, botY=y+NH, midY=botY+GY/2;

    const borderColor = done?"#10B981":active?"#F77F00":"#E5E7EB";
    const bgColor     = active?"#FFF3E0":done?"#F0FDF4":"#ffffff";
    const textColor   = active?"#F77F00":done?"#111827":"#374151";
    const numBg       = done?"#10B981":active?"#F77F00":"#E5E7EB";
    const numColor    = (done||active)?"#fff":"#6B7280";
    const statusColor = done?"#10B981":active?"#F77F00":"#9CA3AF";
    const statusLabel = done?"Completado":active?"En progreso":"Pendiente";
    const title = node.title.length>18?node.title.slice(0,17)+"…":node.title;

    html += `<g data-gn="${idx}" style="cursor:pointer">`;

    // Connector to next
    if(idx<n-1){
      const lineColor = done?"#10B981":"#E5E7EB";
      const arrowFill = done?"#10B981":"#D1D5DB";
      html += `<line x1="${cx}" y1="${botY}" x2="${cx}" y2="${midY-6}" stroke="${lineColor}" stroke-width="2"/>`;
      html += `<polygon points="${cx},${midY+6} ${cx-5},${midY-4} ${cx+5},${midY-4}" fill="${arrowFill}"/>`;
      html += `<line x1="${cx}" y1="${midY+6}" x2="${cx}" y2="${y+NH+GY}" stroke="${lineColor}" stroke-width="2"/>`;
    }

    // Shadow
    html += `<rect x="${x+2}" y="${y+3}" width="${NW}" height="${NH}" rx="12" ry="12" fill="rgba(0,0,0,0.06)"/>`;

    // Box
    html += `<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="12" ry="12" fill="${bgColor}" stroke="${borderColor}" stroke-width="${active?2:1.5}"/>`;

    // Glow ring
    if(active) html += `<rect x="${x-3}" y="${y-3}" width="${NW+6}" height="${NH+6}" rx="15" ry="15" fill="none" stroke="#F77F00" stroke-width="1" stroke-opacity="0.3"/>`;

    // Number badge
    html += `<circle cx="${x+26}" cy="${y+NH/2}" r="13" fill="${numBg}"/>`;
    html += `<text x="${x+26}" y="${y+NH/2+1}" text-anchor="middle" dominant-baseline="middle" font-size="${done?12:11}" font-weight="700" fill="${numColor}">${done?"✓":idx+1}</text>`;

    // Icon
    html += `<text x="${x+50}" y="${y+NH/2-5}" font-size="16" dominant-baseline="middle">${node.icon}</text>`;

    // Title
    html += `<text x="${x+68}" y="${y+NH/2-8}" font-size="12" font-weight="${active?700:500}" fill="${textColor}">${title}</text>`;

    // Status
    html += `<text x="${x+68}" y="${y+NH/2+8}" font-size="10" fill="${statusColor}">${statusLabel}</text>`;

    // Invisible click target
    html += `<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="12" ry="12" fill="transparent" data-gn="${idx}"/>`;

    html += `</g>`;
  });

  svgEl.innerHTML = html;
}

function renderForm(){
  const node = NODES[S.active];
  const data = nd();
  const isLast = S.active===NODES.length-1;

  let h = "";

  // Node header card
  h += `<div class="nhc">
    <div class="nhc-icon">${node.icon}</div>
    <div>
      <div class="nhc-badge">Nodo ${S.active+1} de ${NODES.length}</div>
      <div class="nhc-title">${node.title}</div>
      <div class="nhc-desc">${node.description}</div>
    </div>
  </div>`;

  // Form card
  h += `<div class="fc">`;
  node.fields.forEach(f=>{ h += renderField(f, data); });

  // Actions
  h += `<div class="form-actions">
    <button class="btn-prev" id="btn-prev" ${S.active===0?"disabled":""}>← Anterior</button>
    <button class="btn-next" id="btn-next">${isLast?"✓ Finalizar campaña":"Avanzar →"}</button>
  </div>`;
  h += `</div>`;

  document.getElementById("form-panel").innerHTML = h;
}

function renderField(f, data){
  let h = `<div class="fld" id="fld_${f.key}">`;
  h += `<label class="fld-label">${f.label}${f.required?`<span class="fld-req">*</span>`:""}</label>`;
  if(f.hint) h += `<p class="fld-hint">${f.hint}</p>`;

  if(f.type==="text"){
    h += `<input type="text" id="f_${f.key}" placeholder="${f.placeholder||""}" value="${esc(data[f.key]||"")}" data-fk="${f.key}">`;
  } else if(f.type==="textarea"){
    h += `<textarea id="f_${f.key}" placeholder="${f.placeholder||""}" rows="4" data-fk="${f.key}">${esc(data[f.key]||"")}</textarea>`;
  } else if(f.type==="date"){
    h += `<input type="date" id="f_${f.key}" value="${data[f.key]||""}" data-fk="${f.key}">`;
  } else if(f.type==="static"){
    h += `<div class="fld-static">${f.value||""}</div>`;
  } else if(f.type==="select"){
    h += `<select id="f_${f.key}" data-fk="${f.key}" data-opt-desc="${f.key}">`;
    h += `<option value="">Seleccionar...</option>`;
    (f.options||[]).forEach(o=>{ h += `<option value="${esc(o)}" ${data[f.key]===o?"selected":""}>${esc(o)}</option>`; });
    h += `</select>`;
    const desc = f.optionDescriptions && data[f.key] ? f.optionDescriptions[data[f.key]] : "";
    h += `<div class="opt-desc" id="desc_${f.key}" style="display:${desc?"block":"none"}">${esc(desc)}</div>`;
  } else if(f.type==="multiselect"){
    h += renderMultiselect(f, data);
  } else if(f.type==="dates_group"){
    h += `<div class="dates-grid">`;
    (f.subfields||[]).forEach(sf=>{
      h += `<div>
        <label class="dg-label">${sf.label}</label>
        <input type="date" id="f_${sf.key}" value="${data[sf.key]||""}" data-fk="${sf.key}">
      </div>`;
    });
    h += `</div>`;
  } else if(f.type==="condition_builder"){
    h += renderConditionBuilder(f.key, f.conditionLogic||"AND", data);
  }

  h += `</div>`;
  return h;
}

function renderMultiselect(f, data){
  const sel = (data[f.key]||"").split("||").filter(Boolean);
  const ranked = !!f.ranked;
  let h = "";

  if(ranked && sel.length>0){
    h += `<div class="ms-selected" id="ms-sel_${f.key}">`;
    sel.forEach((opt,i)=>{
      const rc = i===0?"pr":"sc";
      const rl = i===0?"Principal":"Secundario";
      h += `<div class="ms-chip"><span class="ms-chip-rank ${rc}">${rl}</span><span class="ms-chip-name">${esc(opt)}</span><button class="ms-chip-rm" data-ms-rm="${f.key}" data-ms-val="${esc(opt)}">×</button></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="ms-all" id="ms-all_${f.key}">`;
  (f.options||[]).forEach(opt=>{
    const on = sel.includes(opt);
    h += `<button class="ms-opt${on?" on":""}${on&&ranked?" rk":""}" data-ms="${f.key}" data-ms-val="${esc(opt)}">${on&&!ranked?"✓ ":""}${esc(opt)}</button>`;
  });
  h += `</div>`;

  if(ranked && sel.length===0){
    h += `<p class="ms-hint">El primero que selecciones será el canal principal; los siguientes quedan como secundarios.</p>`;
  }

  return h;
}

function renderConditionBuilder(fieldKey, logic, data){
  const conds = getConds(fieldKey);
  const draft = getDraft(dk(fieldKey));
  const lc = logic;

  let h = `<div class="cb-wrap" id="cb_${fieldKey}">`;

  conds.forEach((c,i)=>{
    h += `<div class="cb-row">`;
    h += i===0 ? `<span class="cb-sp"></span>` : `<span class="cb-badge ${lc}">${lc}</span>`;
    h += `<div class="cb-item">
      <span class="cb-f">${esc(c.f)}</span>
      <span class="cb-op ${lc}">${esc(c.op)}</span>
      ${c.val?`<span class="cb-v">${esc(c.val)}</span>`:""}
      <button class="cb-rm" data-cb-rm="${fieldKey}" data-cb-idx="${i}">×</button>
    </div></div>`;
  });

  // Add row
  h += `<div class="cb-row">
    <span class="cb-sp"></span>
    <div class="cb-add-row" id="cbar_${fieldKey}">`;

  // Field select
  h += `<select class="cb-sel-f" data-cb-f="${fieldKey}">
    <option value="">Campo...</option>
    <optgroup label="Supplier">${ALL_CB_FIELDS.filter(f=>f.startsWith("Supplier:")).map(f=>`<option value="${esc(f)}" ${draft.f===f?"selected":""}>${esc(f.replace("Supplier: ",""))}</option>`).join("")}</optgroup>
    <optgroup label="Producto">${ALL_CB_FIELDS.filter(f=>f.startsWith("Producto:")).map(f=>`<option value="${esc(f)}" ${draft.f===f?"selected":""}>${esc(f.replace("Producto: ",""))}</option>`).join("")}</optgroup>
    <optgroup label="Operativo">${ALL_CB_FIELDS.filter(f=>f.startsWith("Operativo:")).map(f=>`<option value="${esc(f)}" ${draft.f===f?"selected":""}>${esc(f.replace("Operativo: ",""))}</option>`).join("")}</optgroup>
    <optgroup label="Campaña">${ALL_CB_FIELDS.filter(f=>f.startsWith("Campaña:")).map(f=>`<option value="${esc(f)}" ${draft.f===f?"selected":""}>${esc(f.replace("Campaña: ",""))}</option>`).join("")}</optgroup>
  </select>`;

  if(draft.f){
    const opList = ops(draft.f);
    h += `<select class="cb-sel-op" data-cb-op="${fieldKey}">`;
    opList.forEach(op=>{ h += `<option value="${esc(op)}" ${draft.op===op?"selected":""}>${esc(op)}</option>`; });
    h += `</select>`;

    if(!isImplicit(draft.f)){
      const fcfg = FIELD_CFG[draft.f];
      if(fcfg && (fcfg.vt==="select"||fcfg.vt==="relative_date")){
        h += `<select data-cb-val="${fieldKey}">
          <option value="">Seleccionar...</option>
          ${(fcfg.opts||[]).map(o=>`<option value="${esc(o)}" ${draft.val===o?"selected":""}>${esc(o)}</option>`).join("")}
        </select>`;
      } else if(fcfg && fcfg.vt==="number"){
        h += `<input type="number" data-cb-val="${fieldKey}" value="${esc(draft.val)}" placeholder="ej. 20">`;
      } else {
        h += `<input type="text" data-cb-val="${fieldKey}" value="${esc(draft.val)}" placeholder="Valor...">`;
      }
    } else {
      h += `<div style="flex:1;font-size:12px;color:#9ca3af;font-style:italic;padding:6px 10px;">(sin valor — implícito en el operador)</div>`;
    }
  }

  const canAdd = draft.f && (isImplicit(draft.f) || !!draft.val);
  h += `<button class="cb-add-btn${canAdd?" ok":""}" data-cb-add="${fieldKey}" ${canAdd?"":"disabled"}>+ Agregar</button>`;
  h += `</div></div>`;

  if(conds.length===0){
    h += `<p class="cb-empty">Sin condiciones todavía.</p>`;
  }

  h += `</div>`;
  return h;
}

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
function renderHeader(){
  const name = S.data[0]?.name || "Campaña Prototipo";
  document.getElementById("hdr-name").textContent = name;
  document.getElementById("hdr-prog").textContent = `Nodo ${S.active+1} de ${NODES.length}`;
}

/* ═══════════════════════════════════════════════════
   FULL RENDER
═══════════════════════════════════════════════════ */
function renderAll(){
  renderHeader();
  renderGraph();
  renderForm();
}

/* ═══════════════════════════════════════════════════
   EVENT HANDLING
═══════════════════════════════════════════════════ */

// Graph clicks (use SVG event delegation)
document.getElementById("graph-svg").addEventListener("click", e=>{
  const el = e.target.closest("[data-gn]");
  if(!el) return;
  const idx = parseInt(el.dataset.gn);
  if(idx === S.active) return;
  saveTextFromDOM();
  S.active = idx;
  S.maxReached = Math.max(S.maxReached, idx);
  renderAll();
  document.getElementById("form-panel").scrollTop = 0;
});

// Form interactions (event delegation)
document.getElementById("form-panel").addEventListener("change", e=>{
  const t = e.target;

  // Regular select
  if(t.dataset.optDesc){
    const fk=t.dataset.fk||t.dataset.optDesc;
    nd()[fk]=t.value;
    const descEl=document.getElementById(`desc_${fk}`);
    const node=NODES[S.active];
    const field=node.fields.find(f=>f.key===fk);
    const desc=(field?.optionDescriptions||{})[t.value]||"";
    if(descEl){ descEl.textContent=desc; descEl.style.display=desc?"block":"none"; }
    return;
  }
  if(t.dataset.fk){
    nd()[t.dataset.fk]=t.value;
    return;
  }

  // Condition builder field select
  if(t.dataset.cbF){
    const fk=t.dataset.cbF, f=t.value;
    const op = f ? ops(f)[0]||"=" : "";
    setDraft(dk(fk),{f,op,val:""});
    saveTextFromDOM();
    refreshCB(fk);
    return;
  }
  // Condition builder op select
  if(t.dataset.cbOp){
    const fk=t.dataset.cbOp;
    setDraft(dk(fk),{op:t.value,val:""});
    saveTextFromDOM();
    refreshCB(fk);
    return;
  }
  // Condition builder value
  if(t.dataset.cbVal){
    const fk=t.dataset.cbVal;
    setDraft(dk(fk),{val:t.value});
    // Update add button
    const d=getDraft(dk(fk));
    const canAdd = d.f&&(isImplicit(d.f)||!!t.value);
    const btn=document.querySelector(`[data-cb-add="${fk}"]`);
    if(btn){ btn.disabled=!canAdd; btn.className="cb-add-btn"+(canAdd?" ok":""); }
    return;
  }
});

document.getElementById("form-panel").addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.cbVal){
    const fk=t.dataset.cbVal;
    setDraft(dk(fk),{val:t.value});
    const d=getDraft(dk(fk));
    const canAdd=d.f&&(isImplicit(d.f)||!!t.value);
    const btn=document.querySelector(`[data-cb-add="${fk}"]`);
    if(btn){ btn.disabled=!canAdd; btn.className="cb-add-btn"+(canAdd?" ok":""); }
  }
});

document.getElementById("form-panel").addEventListener("click", e=>{
  const t = e.target;

  // Advance button
  if(t.id==="btn-next"){
    saveTextFromDOM();
    S.completed.add(S.active);
    const next=S.active+1;
    if(next<NODES.length){ S.active=next; S.maxReached=Math.max(S.maxReached,next); }
    renderAll();
    document.getElementById("form-panel").scrollTop=0;
    return;
  }

  // Back button
  if(t.id==="btn-prev"){
    if(S.active>0){ saveTextFromDOM(); S.active--; renderAll(); document.getElementById("form-panel").scrollTop=0; }
    return;
  }

  // Multiselect toggle
  const msEl = t.closest("[data-ms]");
  if(msEl && msEl.dataset.ms){
    const fk=msEl.dataset.ms, val=msEl.dataset.msVal;
    const node=NODES[S.active], field=node.fields.find(f=>f.key===fk);
    const sel=(nd()[fk]||"").split("||").filter(Boolean);
    const on=sel.includes(val);
    nd()[fk]=(on?sel.filter(s=>s!==val):[...sel,val]).join("||");
    saveTextFromDOM();
    refreshMS(fk, field);
    return;
  }

  // Multiselect chip remove
  if(t.dataset.msRm){
    const fk=t.dataset.msRm, val=t.dataset.msVal;
    const node=NODES[S.active], field=node.fields.find(f=>f.key===fk);
    const sel=(nd()[fk]||"").split("||").filter(s=>s&&s!==val);
    nd()[fk]=sel.join("||");
    saveTextFromDOM();
    refreshMS(fk, field);
    return;
  }

  // Condition add
  if(t.dataset.cbAdd){
    const fk=t.dataset.cbAdd, d=getDraft(dk(fk));
    if(!d.f) return;
    const val=isImplicit(d.f)?d.op:d.val;
    if(!isImplicit(d.f)&&!val) return;
    const conds=getConds(fk);
    saveConds(fk,[...conds,{f:d.f,op:d.op,val}]);
    setDraft(dk(fk),{f:"",op:"",val:""});
    saveTextFromDOM();
    refreshCB(fk);
    return;
  }

  // Condition remove
  if(t.dataset.cbRm){
    const fk=t.dataset.cbRm, idx=parseInt(t.dataset.cbIdx);
    const conds=getConds(fk).filter((_,i)=>i!==idx);
    saveConds(fk,conds);
    saveTextFromDOM();
    refreshCB(fk);
    return;
  }
});

// Targeted refresh: multiselect
function refreshMS(fk, field){
  const container=document.getElementById(`fld_${fk}`);
  if(!container) return;
  const data=nd();
  // Re-render inner HTML except label and hint
  const label=container.querySelector(".fld-label")?.outerHTML||"";
  const hint=container.querySelector(".fld-hint")?.outerHTML||"";
  container.innerHTML=label+hint+renderMultiselect(field,data);
}

// Targeted refresh: condition builder
function refreshCB(fk){
  const node=NODES[S.active];
  const field=node.fields.find(f=>f.key===fk);
  if(!field) return;
  const container=document.getElementById(`fld_${fk}`);
  if(!container) return;
  const label=container.querySelector(".fld-label")?.outerHTML||"";
  const hint=container.querySelector(".fld-hint")?.outerHTML||"";
  container.innerHTML=label+hint+renderConditionBuilder(fk,field.conditionLogic||"AND",nd());
}

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
renderAll();
</script>
</body>
</html>
